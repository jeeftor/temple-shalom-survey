name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:                       # only deploy when these files change
      - 'index.html'
      - 'survey.json'
      - 'submit.gs'
      - '.github/workflows/deploy.yml'
  create:
    tags:
      - 'v*'
  workflow_dispatch:             # allow manual trigger from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: true       # cancel queued deploy if a newer push arrives

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version
        run: |
          cat > version.json << EOF
          {
            "sha":    "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "url":    "https://temple-shalom-survey.pages.dev",
            "date":   "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Stamped: $(cat version.json)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=temple-shalom-survey --branch=master --commit-dirty=true
