<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Temple Shalom Survey — Admin</title>
  <style>
    :root {
      --blue:      #0038b8;
      --blue-dark: #00277d;
      --blue-pale: #dce8ff;
      --green:     #1a7f3c;
      --red:       #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #f4f6fb;
      color: #111;
      margin: 0;
      padding: 0;
    }

    /* ── Header ── */
    header {
      background: var(--blue);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 18pt; }
    header p  { margin: 0; font-size: 9pt; opacity: 0.75; }

    /* ── Auth screen ── */
    #authScreen {
      max-width: 420px;
      margin: 6rem auto;
      background: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 16px rgba(0,56,184,0.12);
      text-align: center;
    }
    #authScreen h2 { color: var(--blue-dark); margin-top: 0; }
    #authScreen input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 11pt;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      margin: 0.5rem 0 1rem;
    }
    #authScreen button {
      background: var(--blue);
      color: white;
      border: none;
      padding: 0.6rem 2rem;
      border-radius: 6px;
      font-size: 11pt;
      cursor: pointer;
      font-weight: bold;
    }
    #authScreen button:hover { background: var(--blue-dark); }
    #authError { color: var(--red); font-size: 9pt; margin-top: 0.5rem; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }

    /* Stats cards */
    .stat-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      flex: 1;
      min-width: 150px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      border-top: 4px solid var(--blue);
    }
    .stat-card .val  { font-size: 26pt; font-weight: bold; color: var(--blue-dark); line-height: 1.1; }
    .stat-card .lbl  { font-size: 9pt; color: #666; margin-top: 0.2rem; }

    /* NPS gauge */
    .nps-bar-wrap { margin-top: 0.4rem; display: flex; gap: 2px; height: 8px; }
    .nps-bar-wrap .seg { flex: 1; border-radius: 2px; }
    .seg.detract { background: var(--red); }
    .seg.passive { background: #e0a800; }
    .seg.promote { background: var(--green); }

    /* Section ── */
    .panel {
      background: white;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .panel-hdr {
      background: var(--blue);
      color: white;
      padding: 0.6rem 1rem;
      font-weight: bold;
      font-size: 11pt;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-hdr a {
      color: #b8d0ff;
      font-size: 9pt;
      font-weight: normal;
      text-decoration: none;
    }
    .panel-hdr a:hover { color: white; }
    .panel-body { padding: 1rem; }

    /* Bar charts */
    .bar-item { margin: 0.4rem 0; display: flex; align-items: center; gap: 0.5rem; font-size: 10pt; }
    .bar-item .bar-lbl { width: 200px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-item .bar-track { flex: 1; background: var(--blue-pale); border-radius: 4px; height: 16px; position: relative; }
    .bar-item .bar-fill  { background: var(--blue); border-radius: 4px; height: 100%; transition: width 0.4s; }
    .bar-item .bar-count { width: 50px; text-align: right; color: #555; flex-shrink: 0; }
    .bar-item.no-answer .bar-fill { background: #ccc; }
    .bar-item.no-answer .bar-lbl { color: #999; font-style: italic; }
    .response-rate { font-size: 8pt; color: #888; margin-bottom: 0.4rem; }

    /* Data explorer */
    .explorer-bar {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 1rem;
    }
    .explorer-field { display: flex; flex-direction: column; gap: 0.2rem; }
    .explorer-field label { font-size: 8pt; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .explorer-field select {
      padding: 0.4rem 0.6rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 10pt;
      background: white;
      color: var(--text);
      min-width: 200px;
      max-width: 300px;
    }
    .explorer-field select:focus { border-color: var(--blue); outline: none; }
    .explorer-clear {
      padding: 0.4rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: white;
      cursor: pointer;
      font-size: 10pt;
      color: #666;
    }
    .explorer-clear:hover { background: var(--blue-pale); border-color: var(--blue); }
    .explorer-result { padding: 0 1rem 1rem; }
    .explorer-empty { color: #888; font-size: 10pt; padding: 2rem; text-align: center; }
    .explorer-subtitle { font-size: 9pt; color: #888; margin-bottom: 0.5rem; }
    .explorer-crosstab-note {
      background: var(--blue-pale);
      border-left: 3px solid var(--blue);
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.75rem;
      font-size: 9pt;
      color: var(--blue-dark);
      border-radius: 0 4px 4px 0;
    }
    .comment-list { max-height: 400px; overflow-y: auto; }
    .comment-item {
      padding: 0.6rem 0.8rem;
      margin: 0.3rem 0;
      background: #f8f9fc;
      border-left: 3px solid var(--blue-light);
      border-radius: 0 4px 4px 0;
      font-size: 10pt;
      color: #333;
      line-height: 1.4;
    }
    .comment-meta { font-size: 8pt; color: #999; margin-top: 0.2rem; }

    /* Responses table */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    th {
      background: var(--blue);
      color: white;
      padding: 0.4rem 0.6rem;
      text-align: left;
      white-space: nowrap;
    }
    td { border-bottom: 1px solid #e8ecf5; padding: 0.35rem 0.6rem; vertical-align: top; }
    tr:hover td { background: #f0f5ff; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 8pt;
      font-weight: bold;
    }
    .badge-us  { background: #dce8ff; color: var(--blue-dark); }
    .badge-ok  { background: #d4edda; color: #155724; }
    .badge-dupe { background: #fff3cd; color: #856404; }

    /* Expandable row */
    .expand-btn { cursor: pointer; color: var(--blue); font-size: 9pt; background: none; border: none; padding: 0; }
    .detail-row td { background: #f8faff; padding: 0.5rem 1rem; font-size: 9pt; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.3rem 1rem; }
    .detail-grid .dk { color: #888; }
    .detail-grid .dv { font-weight: 500; word-break: break-word; }

    /* Toolbar */
    .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .toolbar input {
      padding: 0.4rem 0.7rem;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      font-size: 10pt;
      flex: 1;
      min-width: 180px;
    }
    .toolbar button {
      padding: 0.4rem 1rem;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10pt;
    }
    .toolbar button:hover { background: var(--blue-dark); }
    .toolbar .btn-outline {
      background: white;
      color: var(--blue);
      border: 1.5px solid var(--blue);
    }
    .toolbar .btn-outline:hover { background: var(--blue-pale); }

    .empty { color: #888; font-style: italic; padding: 1rem; text-align: center; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Temple Shalom Survey — Admin</h1>
    <p id="hdrSub">Loading…</p>
  </div>
</header>

<!-- Auth gate -->
<div id="authScreen">
  <h2>Admin Access</h2>
  <p style="color:#555;font-size:10pt;">Enter your export key to view survey results.</p>
  <input type="password" id="keyInput" placeholder="Export key…" />
  <br/>
  <button onclick="doAuth()">Sign In</button>
  <div id="authError"></div>
</div>

<!-- Dashboard -->
<div id="dashboard">

  <!-- Stats row -->
  <div class="stat-row" id="statRow"></div>

  <!-- Data explorer -->
  <div class="panel">
    <div class="panel-hdr">Data Explorer</div>
    <div class="explorer-bar">
      <div class="explorer-field">
        <label for="explorerQ">Question</label>
        <select id="explorerQ" onchange="explorerUpdate()"></select>
      </div>
      <div class="explorer-field">
        <label for="explorerFilterQ">Cross-tab filter (optional)</label>
        <select id="explorerFilterQ" onchange="explorerUpdateFilter()"></select>
      </div>
      <div class="explorer-field" id="explorerFilterValWrap" style="display:none;">
        <label for="explorerFilterVal">Filter value</label>
        <select id="explorerFilterVal" onchange="explorerUpdate()"></select>
      </div>
      <button class="explorer-clear" onclick="explorerClear()">Clear</button>
    </div>
    <div class="explorer-result" id="explorerResult">
      <div class="explorer-empty">Pick a question above to explore the data.</div>
    </div>
  </div>

  <!-- Aggregations -->
  <div id="charts"></div>

  <!-- Response table -->
  <div class="panel">
    <div class="panel-hdr">
      Individual Responses
      <a href="#" id="csvLink">Download CSV ↓</a>
    </div>
    <div class="panel-body">
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search responses…" oninput="filterTable()" />
        <button class="btn-outline" onclick="clearSearch()">Clear</button>
        <label style="margin-left:auto;font-size:10pt;display:flex;align-items:center;gap:0.3rem;cursor:pointer;">
          <input type="checkbox" id="latestOnly" checked onchange="toggleLatestOnly()" />
          Latest per person only
        </label>
      </div>
      <div class="tbl-wrap">
        <table id="respTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Country</th>
              <th>Sub</th>
              <th>Time (min)</th>
              <th>Sections</th>
              <th>NPS</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="respBody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
const WORKER = "https://temple-shalom-survey.jeffstein.workers.dev";
let allResponses = [];
let exportKey    = "";
let latestOnly   = true;

// ── Auth ─────────────────────────────────────────────────────────────────────

// Pre-fill key from URL param ?key=X for bookmark-ability
const urlKey = new URLSearchParams(location.search).get("key");
if (urlKey) {
  document.getElementById("keyInput").value = urlKey;
  setTimeout(doAuth, 0);
}

function doAuth() {
  const key = document.getElementById("keyInput").value.trim();
  if (!key) return;
  exportKey = key;
  document.getElementById("authError").textContent = "";
  loadData(key);
}

document.getElementById("keyInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doAuth();
});

// ── Load data ─────────────────────────────────────────────────────────────────

async function loadData(key) {
  try {
    const [res] = await Promise.all([
      fetch(`${WORKER}/results?key=${encodeURIComponent(key)}`),
      loadSurveyDef(),
    ]);
    if (res.status === 401) {
      document.getElementById("authError").textContent = "Invalid key. Try again.";
      return;
    }
    const data = await res.json();
    allResponses = data.responses || [];

    document.getElementById("authScreen").style.display = "none";
    document.getElementById("dashboard").style.display  = "block";

    latestOnly = document.getElementById("latestOnly").checked;
    const displayResponses = latestOnly ? getLatestPerPerson(allResponses) : allResponses;
    const uniqueCount = new Set(allResponses.map(x => x.session_id).filter(Boolean)).size;

    document.getElementById("hdrSub").textContent =
      `${uniqueCount} respondent${uniqueCount !== 1 ? "s" : ""} · ${allResponses.length} total submission${allResponses.length !== 1 ? "s" : ""} · as of ${new Date().toLocaleString()}`;

    document.getElementById("csvLink").href =
      `${WORKER}/export?key=${encodeURIComponent(key)}`;
    document.getElementById("csvLink").download = "responses.csv";

    renderStats(displayResponses);
    initExplorer();
    renderCharts(displayResponses);
    renderTable(displayResponses);
  } catch (e) {
    document.getElementById("authError").textContent = "Error: " + e.message;
  }
}

// ── Helpers: latest per person ────────────────────────────────────────────────

function getLatestPerPerson(responses) {
  const bySession = new Map();
  for (const r of responses) {
    const key = r.session_id || r.response_id; // fallback to response_id if no session
    const existing = bySession.get(key);
    if (!existing || new Date(r.timestamp) > new Date(existing.timestamp)) {
      bySession.set(key, r);
    }
  }
  return [...bySession.values()];
}

function toggleLatestOnly() {
  latestOnly = document.getElementById("latestOnly").checked;
  const displayResponses = latestOnly ? getLatestPerPerson(allResponses) : allResponses;
  renderStats(displayResponses);
  renderCharts(displayResponses);
  renderTable(displayResponses);
}

// ── Stats cards ───────────────────────────────────────────────────────────────

function renderStats(responses) {
  const r = responses;
  const npsVals = r.map(x => x.answers?.q_nps).filter(v => v != null);
  const nps = calcNPS(npsVals);
  const avgMin = r.filter(x => x.completion_seconds)
    .reduce((s, x, _, a) => s + x.completion_seconds / a.length, 0) / 60;
  const uniqueCount = new Set(allResponses.map(x => x.session_id).filter(Boolean)).size;
  const resubmits = allResponses.filter(x => (x.submission_number || 1) > 1).length;

  const cards = [
    { val: r.length,                           lbl: latestOnly ? "Unique Respondents" : "Total Responses" },
    { val: nps != null ? nps : "—",           lbl: "NPS Score",       extra: npsBar(npsVals) },
    { val: avgMin ? avgMin.toFixed(1) + "m" : "—", lbl: "Avg Completion" },
    { val: resubmits,                          lbl: "Re-submissions" },
  ];

  document.getElementById("statRow").innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="val">${c.val}</div>
      <div class="lbl">${c.lbl}</div>
      ${c.extra || ""}
    </div>
  `).join("");
}

function calcNPS(vals) {
  if (!vals.length) return null;
  const promoters  = vals.filter(v => v >= 9).length;
  const detractors = vals.filter(v => v <= 6).length;
  return Math.round((promoters - detractors) / vals.length * 100);
}

function npsBar(vals) {
  if (!vals.length) return "";
  const n = vals.length;
  const p = vals.filter(v => v >= 9).length / n * 100;
  const pa = vals.filter(v => v === 7 || v === 8).length / n * 100;
  const d = vals.filter(v => v <= 6).length / n * 100;
  return `<div class="nps-bar-wrap">
    <div class="seg detract" style="flex:${d}"></div>
    <div class="seg passive" style="flex:${pa}"></div>
    <div class="seg promote" style="flex:${p}"></div>
  </div><div style="font-size:8pt;color:#888;margin-top:2px">${Math.round(d)}% detractors · ${Math.round(pa)}% passives · ${Math.round(p)}% promoters</div>`;
}

// ── Data Explorer ─────────────────────────────────────────────────────────────

// Flatten all questions from surveyDef into a list with section info
function getAllQuestions() {
  if (!surveyDef) return [];
  const qs = [];
  surveyDef.pages.forEach((page, pageIdx) => {
    (page.elements || []).forEach(q => {
      qs.push({ ...q, sectionTitle: page.title || `Section ${pageIdx + 1}`, pageIdx });
    });
  });
  return qs;
}

function findQuestion(name) {
  return getAllQuestions().find(q => q.name === name);
}

// Populate the explorer dropdowns
function initExplorer() {
  const qSelect = document.getElementById("explorerQ");
  const filterQSelect = document.getElementById("explorerFilterQ");
  const qs = getAllQuestions();

  // Group by section for the question dropdown
  qSelect.innerHTML = '<option value="">— Pick a question —</option>';
  let currentSection = "";
  qs.forEach(q => {
    if (q.sectionTitle !== currentSection) {
      currentSection = q.sectionTitle;
      const og = document.createElement("optgroup");
      og.label = currentSection;
      qSelect.appendChild(og);
    }
    const opt = document.createElement("option");
    opt.value = q.name;
    opt.textContent = (q.title || q.name).slice(0, 70);
    qSelect.lastChild.appendChild(opt); // append to last optgroup
  });

  // Filter dropdown: same questions (for cross-tab)
  filterQSelect.innerHTML = '<option value="">— No filter —</option>';
  currentSection = "";
  qs.forEach(q => {
    if (q.sectionTitle !== currentSection) {
      currentSection = q.sectionTitle;
      const og = document.createElement("optgroup");
      og.label = currentSection;
      filterQSelect.appendChild(og);
    }
    const opt = document.createElement("option");
    opt.value = q.name;
    opt.textContent = (q.title || q.name).slice(0, 70);
    filterQSelect.lastChild.appendChild(opt);
  });
}

// When the filter question changes, populate the filter value dropdown
function explorerUpdateFilter() {
  const filterQName = document.getElementById("explorerFilterQ").value;
  const valWrap = document.getElementById("explorerFilterValWrap");
  const valSelect = document.getElementById("explorerFilterVal");

  if (!filterQName) {
    valWrap.style.display = "none";
    explorerUpdate();
    return;
  }

  const q = findQuestion(filterQName);
  if (!q) { valWrap.style.display = "none"; return; }

  valWrap.style.display = "flex";

  // Get unique values from responses for this question
  const displayResponses = latestOnly ? getLatestPerPerson(allResponses) : allResponses;
  const labels = choiceMap(q);
  const { rows, cols } = q.type === "matrix" ? matrixLookups(q) : { rows: null, cols: null };

  let uniqueVals = new Set();
  displayResponses.forEach(r => {
    const v = r.answers?.[q.name];
    if (v == null || v === "") return;
    if (q.type === "checkbox") {
      (Array.isArray(v) ? v : [v]).forEach(x => uniqueVals.add(x));
    } else if (q.type === "matrix") {
      if (typeof v === "object") {
        Object.entries(v).forEach(([rowVal, colVal]) => {
          if (colVal) uniqueVals.add(`${rowVal}=${colVal}`);
        });
      }
    } else {
      uniqueVals.add(v);
    }
  });

  valSelect.innerHTML = '<option value="">— Any —</option>';
  [...uniqueVals].sort().forEach(val => {
    let label;
    if (q.type === "matrix") {
      const [rv, cv] = val.split("=");
      label = `${rows[rv] || rv} → ${cols[cv] || cv}`;
    } else {
      label = labels[val] || val;
    }
    const opt = document.createElement("option");
    opt.value = val;
    opt.textContent = label;
    valSelect.appendChild(opt);
  });

  explorerUpdate();
}

// Main explorer render
function explorerUpdate() {
  const qName = document.getElementById("explorerQ").value;
  const result = document.getElementById("explorerResult");

  if (!qName) {
    result.innerHTML = '<div class="explorer-empty">Pick a question above to explore the data.</div>';
    return;
  }

  const q = findQuestion(qName);
  if (!q) return;

  // Get filtered responses
  let displayResponses = latestOnly ? getLatestPerPerson(allResponses) : allResponses;

  // Apply cross-tab filter
  const filterQName = document.getElementById("explorerFilterQ").value;
  const filterVal = document.getElementById("explorerFilterVal").value;
  let filterNote = "";

  if (filterQName && filterVal) {
    const filterQ = findQuestion(filterQName);
    if (filterQ) {
      const before = displayResponses.length;
      displayResponses = displayResponses.filter(r => {
        const v = r.answers?.[filterQName];
        if (v == null || v === "") return false;
        if (filterQ.type === "checkbox") {
          return (Array.isArray(v) ? v : [v]).includes(filterVal);
        } else if (filterQ.type === "matrix") {
          if (typeof v !== "object") return false;
          const [rv, cv] = filterVal.split("=");
          return v[rv] === cv;
        }
        return v === filterVal;
      });
      const filterLabels = choiceMap(filterQ);
      const { rows: fRows, cols: fCols } = filterQ.type === "matrix" ? matrixLookups(filterQ) : { rows: null, cols: null };
      let valLabel;
      if (filterQ.type === "matrix") {
        const [rv, cv] = filterVal.split("=");
        valLabel = `${fRows[rv] || rv} → ${fCols[cv] || cv}`;
      } else {
        valLabel = filterLabels[filterVal] || filterVal;
      }
      filterNote = `Filtered to ${filterQ.title || filterQ.name} = "${valLabel}" — ${displayResponses.length} of ${before} responses`;
    }
  }

  if (!displayResponses.length) {
    result.innerHTML = `<div class="explorer-empty">No responses match this filter.</div>`;
    return;
  }

  let html = "";

  if (filterNote) {
    html += `<div class="explorer-crosstab-note">${filterNote}</div>`;
  }

  html += `<div class="explorer-subtitle">${displayResponses.length} response${displayResponses.length !== 1 ? "s" : ""}</div>`;

  // Render based on question type
  if (q.type === "radiogroup" || q.type === "checkbox") {
    html += renderChoiceChartHTML(q, displayResponses);
  } else if (q.type === "rating") {
    html += renderRatingChartHTML(q, displayResponses);
  } else if (q.type === "matrix") {
    html += renderMatrixChartHTML(q, displayResponses);
  } else if (q.type === "comment" || q.type === "text") {
    html += renderCommentList(q, displayResponses);
  }

  result.innerHTML = html;
}

// HTML-returning versions of the chart functions (for the explorer)
function renderChoiceChartHTML(q, responses) {
  const labels = choiceMap(q);
  const counts = {};
  let answered = 0;
  responses.forEach(r => {
    const v = r.answers?.[q.name];
    if (v == null || v === "") return;
    const vals = Array.isArray(v) ? v : [v];
    vals.forEach(x => {
      const lbl = labels[x] || x;
      counts[lbl] = (counts[lbl] || 0) + 1;
    });
    answered++;
  });
  if (!Object.keys(counts).length) return '<div class="explorer-empty">No data for this question.</div>';

  const skipped = responses.length - answered;
  let sorted;
  if (q.choices && q.choices.length) {
    sorted = q.choices.map(c => [c.text || c.value, counts[c.text || c.value] || 0]).filter(([, c]) => c > 0);
  } else {
    sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  return `<div class="panel-body">
    <div class="response-rate">${answered} of ${responses.length} answered (${Math.round(answered/responses.length*100)}%)</div>
    ${sorted.map(([lbl, cnt]) => `
      <div class="bar-item">
        <div class="bar-lbl" title="${lbl}">${lbl}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt/responses.length*100)}%"></div></div>
        <div class="bar-count">${cnt} (${Math.round(cnt/responses.length*100)}%)</div>
      </div>`).join("")}
    ${skipped > 0 ? `
      <div class="bar-item no-answer">
        <div class="bar-lbl">No answer</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(skipped/responses.length*100)}%"></div></div>
        <div class="bar-count">${skipped} (${Math.round(skipped/responses.length*100)}%)</div>
      </div>` : ""}
  </div>`;
}

function renderRatingChartHTML(q, responses) {
  const vals = responses.map(r => r.answers?.[q.name]).filter(v => v != null && v !== "");
  if (!vals.length) return '<div class="explorer-empty">No data for this question.</div>';
  const min = q.rateMin || 0;
  const max = q.rateMax || 10;
  const counts = {};
  for (let i = min; i <= max; i++) counts[i] = 0;
  vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const avg = (vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(1);
  const skipped = responses.length - vals.length;

  return `<div class="panel-body">
    <div class="response-rate">${vals.length} of ${responses.length} answered (${Math.round(vals.length/responses.length*100)}%)</div>
    <div style="font-size:10pt;color:#666;margin-bottom:0.5rem;">Average: <strong>${avg}</strong></div>
    ${Object.entries(counts).map(([val, cnt]) => `
      <div class="bar-item">
        <div class="bar-lbl">${val}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt/responses.length*100)}%"></div></div>
        <div class="bar-count">${cnt} (${Math.round(cnt/responses.length*100)}%)</div>
      </div>`).join("")}
    ${skipped > 0 ? `
      <div class="bar-item no-answer">
        <div class="bar-lbl">No answer</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(skipped/responses.length*100)}%"></div></div>
        <div class="bar-count">${skipped} (${Math.round(skipped/responses.length*100)}%)</div>
      </div>` : ""}
  </div>`;
}

function renderMatrixChartHTML(q, responses) {
  const { rows, cols, colOrder } = matrixLookups(q);
  let hasData = false;
  responses.forEach(r => {
    const v = r.answers?.[q.name];
    if (v && typeof v === "object") hasData = true;
  });
  if (!hasData) return '<div class="explorer-empty">No data for this question.</div>';

  let html = '<div class="panel-body">';
  Object.entries(rows).forEach(([rowVal, rowLabel]) => {
    const counts = {};
    let total = 0;
    responses.forEach(r => {
      const v = r.answers?.[q.name];
      if (!v || typeof v !== "object") return;
      const cell = v[rowVal];
      if (cell == null || cell === "") return;
      const lbl = cols[cell] || cell;
      counts[lbl] = (counts[lbl] || 0) + 1;
      total++;
    });
    if (total === 0) {
      html += `<div style="margin:0.6rem 0 0.2rem;font-weight:600;font-size:9pt;color:#333;">${rowLabel}</div>`;
      html += `<div class="bar-item no-answer"><div class="bar-lbl">No answers</div><div class="bar-track"></div><div class="bar-count">0 of ${responses.length}</div></div>`;
      return;
    }
    html += `<div style="margin:0.6rem 0 0.2rem;font-weight:600;font-size:9pt;color:#333;">${rowLabel} <span style="font-weight:400;color:#999;font-size:8pt">(${total}/${responses.length})</span></div>`;
    colOrder.forEach(colVal => {
      const lbl = cols[colVal] || colVal;
      const cnt = counts[lbl] || 0;
      if (cnt === 0) return;
      html += `
        <div class="bar-item">
          <div class="bar-lbl" title="${lbl}">${lbl}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt/responses.length*100)}%"></div></div>
          <div class="bar-count">${cnt} (${Math.round(cnt/responses.length*100)}%)</div>
        </div>`;
    });
    const rowSkipped = responses.length - total;
    if (rowSkipped > 0) {
      html += `
        <div class="bar-item no-answer">
          <div class="bar-lbl">No answer</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(rowSkipped/responses.length*100)}%"></div></div>
          <div class="bar-count">${rowSkipped} (${Math.round(rowSkipped/responses.length*100)}%)</div>
        </div>`;
    }
  });
  html += '</div>';
  return html;
}

function renderCommentList(q, responses) {
  const answers = responses
    .map(r => ({ text: r.answers?.[q.name], date: r.timestamp, sub: r.submission_number }))
    .filter(a => a.text && a.text.trim())
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  const skipped = responses.length - answers.length;
  if (!answers.length) return `<div class="explorer-empty">No text answers for this question. (${skipped} of ${responses.length} skipped)</div>`;

  return `<div class="explorer-subtitle">${answers.length} of ${responses.length} answered (${skipped} skipped)</div>
    <div class="comment-list">
      ${answers.map(a => `
        <div class="comment-item">
          ${escapeHtml(a.text)}
          <div class="comment-meta">${new Date(a.date).toLocaleDateString()}${a.sub > 1 ? " · resubmission #" + a.sub : ""}</div>
        </div>`).join("")}
    </div>`;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function explorerClear() {
  document.getElementById("explorerQ").value = "";
  document.getElementById("explorerFilterQ").value = "";
  document.getElementById("explorerFilterValWrap").style.display = "none";
  document.getElementById("explorerResult").innerHTML = '<div class="explorer-empty">Pick a question above to explore the data.</div>';
}

// ── Aggregate charts (auto-discovered from survey.json) ──────────────────────

let surveyDef = null;

async function loadSurveyDef() {
  if (surveyDef) return surveyDef;
  try {
    const res = await fetch("survey.json");
    surveyDef = await res.json();
  } catch {
    surveyDef = { pages: [] };
  }
  return surveyDef;
}

// Build a value→label lookup from choices
function choiceMap(question) {
  const m = {};
  (question.choices || []).forEach(c => { m[c.value] = c.text || c.value; });
  return m;
}

function matrixLookups(question) {
  const rows = {};
  (question.rows || []).forEach(r => { rows[r.value] = r.text || r.value; });
  const cols = {};
  (question.columns || []).forEach(c => { cols[c.value] = c.text || c.value; });
  return { rows, cols, colOrder: (question.columns || []).map(c => c.value) };
}

function renderCharts(responses) {
  const wrap = document.getElementById("charts");
  wrap.innerHTML = "";

  if (!surveyDef) { wrap.textContent = "Loading chart definitions…"; return; }

  surveyDef.pages.forEach((page, pageIdx) => {
    const chartable = (page.elements || []).filter(q =>
      ["radiogroup", "checkbox", "rating", "matrix"].includes(q.type)
    );
    if (!chartable.length) return;

    // Section header
    const hdr = document.createElement("h3");
    hdr.style.cssText = "grid-column:1/-1;font-size:12pt;color:var(--blue-dark);margin:1.5rem 0 0.5rem;border-bottom:1px solid var(--border);padding-bottom:0.3rem;";
    hdr.textContent = page.title || `Section ${pageIdx + 1}`;
    wrap.appendChild(hdr);

    const grid = document.createElement("div");
    grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:1rem;margin-bottom:1rem;";

    chartable.forEach(q => {
      let panel = null;
      if (q.type === "radiogroup" || q.type === "checkbox") {
        panel = renderChoiceChart(q, responses);
      } else if (q.type === "rating") {
        panel = renderRatingChart(q, responses);
      } else if (q.type === "matrix") {
        panel = renderMatrixChart(q, responses);
      }
      if (panel) grid.appendChild(panel);
    });

    if (grid.children.length) wrap.appendChild(grid);
  });
}

function renderChoiceChart(q, responses) {
  const labels = choiceMap(q);
  const counts = {};
  let total = 0;
  responses.forEach(r => {
    const v = r.answers?.[q.name];
    if (v == null || v === "") return;
    const vals = Array.isArray(v) ? v : [v];
    vals.forEach(x => {
      const lbl = labels[x] || x;
      counts[lbl] = (counts[lbl] || 0) + 1;
    });
    total++;
  });
  if (!Object.keys(counts).length) return null;

  const answered = total;
  const skipped = responses.length - answered;

  // Preserve choice order if available, otherwise sort by count
  let sorted;
  if (q.choices && q.choices.length) {
    sorted = q.choices.map(c => [c.text || c.value, counts[c.text || c.value] || 0])
      .filter(([, c]) => c > 0);
  } else {
    sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="panel-hdr">${q.title || q.name}${q.type === "checkbox" ? " <span style='font-weight:400;color:#888;font-size:9pt'>(multi-select)</span>" : ""}</div>
    <div class="panel-body">
      <div class="response-rate">${answered} of ${responses.length} answered (${Math.round(answered/responses.length*100)}%)</div>
      ${sorted.map(([lbl, cnt]) => `
        <div class="bar-item">
          <div class="bar-lbl" title="${lbl}">${lbl}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt/responses.length*100)}%"></div></div>
          <div class="bar-count">${cnt} (${Math.round(cnt/responses.length*100)}%)</div>
        </div>`).join("")}
      ${skipped > 0 ? `
        <div class="bar-item no-answer">
          <div class="bar-lbl">No answer</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(skipped/responses.length*100)}%"></div></div>
          <div class="bar-count">${skipped} (${Math.round(skipped/responses.length*100)}%)</div>
        </div>` : ""}
    </div>`;
  return panel;
}

function renderRatingChart(q, responses) {
  const vals = responses.map(r => r.answers?.[q.name]).filter(v => v != null && v !== "");
  if (!vals.length) return null;
  const min = q.rateMin || 0;
  const max = q.rateMax || 10;
  const counts = {};
  for (let i = min; i <= max; i++) counts[i] = 0;
  vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });

  const panel = document.createElement("div");
  panel.className = "panel";
  const avg = (vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(1);
  const skipped = responses.length - vals.length;
  panel.innerHTML = `
    <div class="panel-hdr">${q.title || q.name} <span style="font-weight:400;color:#888;font-size:9pt">(avg: ${avg})</span></div>
    <div class="panel-body">
      <div class="response-rate">${vals.length} of ${responses.length} answered (${Math.round(vals.length/responses.length*100)}%)</div>
      ${Object.entries(counts).map(([val, cnt]) => `
        <div class="bar-item">
          <div class="bar-lbl">${val}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt/responses.length*100)}%"></div></div>
          <div class="bar-count">${cnt} (${Math.round(cnt/responses.length*100)}%)</div>
        </div>`).join("")}
      ${skipped > 0 ? `
        <div class="bar-item no-answer">
          <div class="bar-lbl">No answer</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(skipped/responses.length*100)}%"></div></div>
          <div class="bar-count">${skipped} (${Math.round(skipped/responses.length*100)}%)</div>
        </div>` : ""}
    </div>`;
  return panel;
}

function renderMatrixChart(q, responses) {
  const { rows, cols, colOrder } = matrixLookups(q);
  // Check if there's any data
  let hasData = false;
  responses.forEach(r => {
    const v = r.answers?.[q.name];
    if (v && typeof v === "object") hasData = true;
  });
  if (!hasData) return null;

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.style.gridColumn = "span 2"; // matrix charts are wider

  let html = `<div class="panel-hdr">${q.title || q.name}</div><div class="panel-body">`;

  Object.entries(rows).forEach(([rowVal, rowLabel]) => {
    const counts = {};
    let total = 0;
    responses.forEach(r => {
      const v = r.answers?.[q.name];
      if (!v || typeof v !== "object") return;
      const cell = v[rowVal];
      if (cell == null || cell === "") return;
      const lbl = cols[cell] || cell;
      counts[lbl] = (counts[lbl] || 0) + 1;
      total++;
    });
    if (total === 0) {
      html += `<div style="margin:0.6rem 0 0.2rem;font-weight:600;font-size:9pt;color:#333;">${rowLabel}</div>`;
      html += `<div class="bar-item no-answer"><div class="bar-lbl">No answers</div><div class="bar-track"></div><div class="bar-count">0 of ${responses.length}</div></div>`;
      return;
    }

    html += `<div style="margin:0.6rem 0 0.2rem;font-weight:600;font-size:9pt;color:#333;">${rowLabel} <span style="font-weight:400;color:#999;font-size:8pt">(${total}/${responses.length})</span></div>`;
    // Use column order
    colOrder.forEach(colVal => {
      const lbl = cols[colVal] || colVal;
      const cnt = counts[lbl] || 0;
      if (cnt === 0) return;
      html += `
        <div class="bar-item">
          <div class="bar-lbl" title="${lbl}">${lbl}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(cnt/responses.length*100)}%"></div></div>
          <div class="bar-count">${cnt} (${Math.round(cnt/responses.length*100)}%)</div>
        </div>`;
    });
    const rowSkipped = responses.length - total;
    if (rowSkipped > 0) {
      html += `
        <div class="bar-item no-answer">
          <div class="bar-lbl">No answer</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(rowSkipped/responses.length*100)}%"></div></div>
          <div class="bar-count">${rowSkipped} (${Math.round(rowSkipped/responses.length*100)}%)</div>
        </div>`;
    }
  });

  html += `</div>`;
  panel.innerHTML = html;
  return panel;
}

// ── Response table ────────────────────────────────────────────────────────────

function renderTable(rows) {
  const tbody = document.getElementById("respBody");
  tbody.innerHTML = "";
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">No responses yet.</td></tr>`;
    return;
  }

  rows.forEach((r, idx) => {
    const date    = r.timestamp ? new Date(r.timestamp).toLocaleString() : "—";
    const mins    = r.completion_seconds ? (r.completion_seconds / 60).toFixed(1) + " min" : "—";
    const secs    = Array.isArray(r.sections_answered) ? r.sections_answered.length : "—";
    const nps     = r.answers?.q_nps ?? "—";
    const country = r.ip_country || "—";
    const subNum  = r.submission_number || 1;
    const subBadge = subNum > 1
      ? `<span class="badge" style="background:#fff3cd;color:#856404;border:1px solid #ffc107;">#${subNum}</span>`
      : `<span style="color:#aaa;">1</span>`;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="color:#888">${r.id}</td>
      <td>${date}</td>
      <td><span class="badge badge-us">${country}</span></td>
      <td>${subBadge}</td>
      <td>${mins}</td>
      <td>${secs}</td>
      <td>${nps !== "—" ? nps + "/10" : "—"}</td>
      <td><button class="expand-btn" data-idx="${idx}" onclick="toggleDetail(this)">▶ Details</button></td>`;

    tbody.appendChild(tr);

    // Detail row (hidden by default)
    const det = document.createElement("tr");
    det.className = "detail-row";
    det.style.display = "none";
    det.dataset.for = idx;

    const answers = r.answers || {};
    const pairs = Object.entries(answers);
    const meta = [
      ["session_id", r.session_id],
      ["submission_number", r.submission_number],
      ["previous_response_id", r.previous_response_id],
      ["referrer", r.referrer],
      ["survey_version", r.survey_version],
    ].filter(([_, v]) => v);

    det.innerHTML = `<td colspan="8">
      <div class="detail-grid">
        ${meta.length ? meta.map(([k, v]) => `
          <div><span class="dk">${k}</span><br/><span class="dv" style="font-size:8pt;color:#666;">${v}</span></div>
        `).join("") : ""}
        ${pairs.length ? pairs.map(([k, v]) => `
          <div><span class="dk">${k}</span><br/><span class="dv">${Array.isArray(v) ? v.join(", ") : v}</span></div>
        `).join("") : "<em>No answers recorded.</em>"}
      </div>
    </td>`;
    tbody.appendChild(det);
  });
}

function toggleDetail(btn) {
  const idx    = btn.dataset.idx;
  const detRow = document.querySelector(`.detail-row[data-for="${idx}"]`);
  const open   = detRow.style.display !== "none";
  detRow.style.display = open ? "none" : "table-row";
  btn.textContent = open ? "▶ Details" : "▼ Hide";
}

function filterTable() {
  const q = document.getElementById("searchBox").value.toLowerCase();
  const base = latestOnly ? getLatestPerPerson(allResponses) : allResponses;
  if (!q) { renderTable(base); return; }
  const filtered = base.filter(r =>
    JSON.stringify(r).toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function clearSearch() {
  document.getElementById("searchBox").value = "";
  const base = latestOnly ? getLatestPerPerson(allResponses) : allResponses;
  renderTable(base);
}
