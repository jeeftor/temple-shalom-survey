<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temple Shalom Survey — Admin</title>
  <style>
    :root {
      --blue:      #0038b8;
      --blue-dark: #00277d;
      --blue-pale: #dce8ff;
      --blue-light: #dce8ff;
      --green:     #1a7f3c;
      --red:       #c0392b;
      --border:    #c9d6e8;
      --radius:    6px;
      --text:      #111;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #f4f6fb;
      color: #111;
      margin: 0;
      padding: 0;
    }

    /* ── Header ── */
    header {
      background: var(--blue);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 18pt; }
    header p  { margin: 0; font-size: 9pt; opacity: 0.75; }

    /* ── Auth screen ── */
    #authScreen {
      max-width: 420px;
      margin: 6rem auto;
      background: white;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 2px 16px rgba(0,56,184,0.12);
      text-align: center;
    }
    #authScreen h2 { color: var(--blue-dark); margin-top: 0; }
    #authScreen input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 11pt;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      margin: 0.5rem 0 1rem;
    }
    #authScreen button {
      background: var(--blue);
      color: white;
      border: none;
      padding: 0.6rem 2rem;
      border-radius: 6px;
      font-size: 11pt;
      cursor: pointer;
      font-weight: bold;
    }
    #authScreen button:hover { background: var(--blue-dark); }
    #authError { color: var(--red); font-size: 9pt; margin-top: 0.5rem; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 1.5rem 2rem; max-width: 1200px; margin: 0 auto; }

    /* Stats cards */
    .stat-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      flex: 1;
      min-width: 150px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      border-top: 4px solid var(--blue);
    }
    .stat-card .val  { font-size: 26pt; font-weight: bold; color: var(--blue-dark); line-height: 1.1; }
    .stat-card .lbl  { font-size: 9pt; color: #666; margin-top: 0.2rem; }

    /* NPS gauge */
    .nps-bar-wrap { margin-top: 0.4rem; display: flex; gap: 2px; height: 8px; }
    .nps-bar-wrap .seg { flex: 1; border-radius: 2px; }
    .seg.detract { background: var(--red); }
    .seg.passive { background: #e0a800; }
    .seg.promote { background: var(--green); }

    /* Section ── */
    .panel {
      background: white;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .panel-hdr {
      background: var(--blue);
      color: white;
      padding: 0.6rem 1rem;
      font-weight: bold;
      font-size: 11pt;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-hdr a {
      color: #b8d0ff;
      font-size: 9pt;
      font-weight: normal;
      text-decoration: none;
    }
    .panel-hdr a:hover { color: white; }
    .panel-body { padding: 1rem; }

    /* Bar charts */
    .bar-item { margin: 0.4rem 0; display: flex; align-items: center; gap: 0.5rem; font-size: 10pt; }
    .bar-item .bar-lbl { width: 200px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-item .bar-track { flex: 1; background: var(--blue-pale); border-radius: 4px; height: 16px; position: relative; }
    .bar-item .bar-fill  { background: var(--blue); border-radius: 4px; height: 100%; transition: width 0.4s; }
    .bar-item .bar-count { width: 50px; text-align: right; color: #555; flex-shrink: 0; }
    .bar-item.no-answer .bar-fill { background: #ccc; }
    .bar-item.no-answer .bar-lbl { color: #999; font-style: italic; }
    .response-rate { font-size: 8pt; color: #888; margin-bottom: 0.4rem; }
    .q-num { display: inline-block; background: var(--blue-pale); color: var(--blue-dark); font-size: 8pt; font-weight: 700; padding: 0.1rem 0.4rem; border-radius: 3px; margin-right: 0.4rem; }

    /* Chart type toggle */
    .chart-toggle {
      display: inline-flex;
      gap: 0.25rem;
      margin-left: auto;
    }
    .chart-toggle button {
      padding: 0.25rem 0.55rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: white;
      cursor: pointer;
      font-size: 13pt;
      line-height: 1;
      color: #999;
      transition: all 0.15s;
      min-width: 28px;
      text-align: center;
    }
    .chart-toggle button:hover { border-color: var(--blue); color: var(--blue); }
    .chart-toggle button.active { background: var(--blue); color: white; border-color: var(--blue); }

    /* Section filter */
    .section-filter { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .section-filter button {
      padding: 0.35rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: white;
      cursor: pointer;
      font-size: 10pt;
      font-weight: 600;
      color: #666;
      transition: all 0.15s;
    }
    .section-filter button:hover { border-color: var(--blue); color: var(--blue); }
    .section-filter button.active { background: var(--blue); color: white; border-color: var(--blue); }

    /* Side-by-side bar + pie */
    .chart-both { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start; }
    .chart-half { flex: 1; min-width: 280px; }
    .chart-half .bar-lbl { width: 160px; }

    /* Pie chart */
    .pie-wrap { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .pie-svg { flex-shrink: 0; }
    .pie-legend { font-size: 9pt; }
    .pie-legend-item { display: flex; align-items: center; gap: 0.3rem; margin: 0.2rem 0; }
    .pie-legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }

    /* Matrix pie grid */
    .matrix-pie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .matrix-pie-cell { background: #f8f9fc; border: 1px solid var(--border); border-radius: var(--radius); padding: 0.6rem; }
    .matrix-pie-title { font-size: 9pt; font-weight: 600; color: #333; margin-bottom: 0.4rem; }
    .matrix-pie-count { font-weight: 400; color: #999; font-size: 8pt; }
    .matrix-pie-cell .pie-wrap { gap: 0.5rem; }
    .matrix-pie-cell .pie-svg { width: 100px; height: 100px; }
    .matrix-pie-cell .pie-legend { font-size: 8pt; }
    .matrix-pie-cell .bar-item { font-size: 9pt; }
    .matrix-pie-cell .bar-lbl { width: 110px; }

    /* Matrix sentiment colors */
    .bar-fill.sent-1 { background: #c62828; }  /* very negative - red */
    .bar-fill.sent-2 { background: #ef6c00; }  /* negative - orange */
    .bar-fill.sent-3 { background: #f9a825; }  /* neutral - yellow */
    .bar-fill.sent-4 { background: #558b2f; }  /* positive - light green */
    .bar-fill.sent-5 { background: #2e7d32; }  /* very positive - green */
    .bar-fill.sent-na { background: #bbb; }     /* N/A - grey */

    /* Data explorer */
    .explorer-panel { background: #f4f7fc; border: 1.5px solid #c9d6e8; }
    .explorer-panel .panel-hdr { background: linear-gradient(135deg, var(--blue-dark), var(--blue)); }
    .explorer-bar {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 1rem;
      background: white;
      border-bottom: 1px solid #e0e7f0;
    }
    .explorer-field { display: flex; flex-direction: column; gap: 0.2rem; }
    .explorer-field label { font-size: 8pt; font-weight: 600; color: #4a6a8a; text-transform: uppercase; letter-spacing: 0.5px; }
    .explorer-field select {
      padding: 0.4rem 0.6rem;
      border: 1.5px solid #b0c4de;
      border-radius: var(--radius);
      font-size: 10pt;
      background: white;
      color: var(--text);
      min-width: 200px;
      max-width: 300px;
    }
    .explorer-field select:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 2px rgba(0,56,184,0.15); }
    .explorer-clear {
      padding: 0.4rem 0.8rem;
      border: 1.5px solid #b0c4de;
      border-radius: var(--radius);
      background: white;
      cursor: pointer;
      font-size: 10pt;
      color: #4a6a8a;
    }
    .explorer-clear:hover { background: var(--blue-pale); border-color: var(--blue); color: var(--blue-dark); }
    .explorer-result { padding: 0 1rem 1rem; }
    .explorer-empty { color: #7a8a9a; font-size: 10pt; padding: 2rem; text-align: center; }
    .explorer-subtitle { font-size: 9pt; color: #4a6a8a; margin-bottom: 0.5rem; font-weight: 600; }
    .explorer-crosstab-note {
      background: var(--blue-pale);
      border-left: 3px solid var(--blue);
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.75rem;
      font-size: 9pt;
      color: var(--blue-dark);
      border-radius: 0 4px 4px 0;
    }

    /* Tab bar */
    .tab-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .tab-bar button {
      padding: 0.6rem 1.4rem;
      border: 2px solid var(--border);
      background: white;
      cursor: pointer;
      font-size: 11pt;
      font-weight: 600;
      color: #666;
      border-radius: var(--radius);
      transition: all 0.2s;
    }
    .tab-bar button:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-pale); }
    .tab-bar button.active {
      color: white;
      background: var(--blue);
      border-color: var(--blue);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .comment-list { max-height: 400px; overflow-y: auto; }
    .comment-item {
      padding: 0.6rem 0.8rem;
      margin: 0.3rem 0;
      background: #f8f9fc;
      border-left: 3px solid var(--blue-light);
      border-radius: 0 4px 4px 0;
      font-size: 10pt;
      color: #333;
      line-height: 1.4;
    }
    .comment-meta { font-size: 8pt; color: #999; margin-top: 0.2rem; }

    /* Responses table */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    th {
      background: var(--blue);
      color: white;
      padding: 0.4rem 0.6rem;
      text-align: left;
      white-space: nowrap;
    }
    td { border-bottom: 1px solid #e8ecf5; padding: 0.35rem 0.6rem; vertical-align: top; }
    tr:hover td { background: #f0f5ff; }
    .badge {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 8pt;
      font-weight: bold;
    }
    .badge-us  { background: #dce8ff; color: var(--blue-dark); }
    .badge-ok  { background: #d4edda; color: #155724; }
    .badge-dupe { background: #fff3cd; color: #856404; }

    /* Expandable row */
    .expand-btn { cursor: pointer; color: var(--blue); font-size: 9pt; background: none; border: none; padding: 0; }
    .detail-row td { background: #f8faff; padding: 0.5rem 1rem; font-size: 9pt; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.3rem 1rem; }
    .detail-grid .dk { color: #888; }
    .detail-grid .dv { font-weight: 500; word-break: break-word; }

    /* Toolbar */
    .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .toolbar input {
      padding: 0.4rem 0.7rem;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      font-size: 10pt;
      flex: 1;
      min-width: 180px;
    }
    .toolbar button {
      padding: 0.4rem 1rem;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10pt;
    }
    .toolbar button:hover { background: var(--blue-dark); }
    .toolbar .btn-outline {
      background: white;
      color: var(--blue);
      border: 1.5px solid var(--blue);
    }
    .toolbar .btn-outline:hover { background: var(--blue-pale); }

    .empty { color: #888; font-style: italic; padding: 1rem; text-align: center; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Temple Shalom Survey — Admin</h1>
    <p id="hdrSub">Loading…</p>
  </div>
</header>

<!-- Auth gate -->
<div id="authScreen">
  <h2>Admin Access</h2>
  <p style="color:#555;font-size:10pt;">Enter your export key to view survey results.</p>
  <input type="password" id="keyInput" placeholder="Export key…" />
  <br/>
  <button onclick="doAuth()">Sign In</button>
  <div id="authError"></div>
</div>

<!-- Dashboard -->
<div id="dashboard">

  <!-- Stats row -->
  <div class="stat-row" id="statRow"></div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="active" onclick="switchTab('dashboard', this)">Dashboard</button>
    <button onclick="switchTab('responses', this)">Individual Responses</button>
  </div>

  <!-- Dashboard tab -->
  <div id="tab-dashboard" class="tab-content active">

  <!-- Data explorer -->
  <div class="panel explorer-panel">
    <div class="panel-hdr">Data Explorer</div>
    <div class="explorer-bar">
      <div class="explorer-field">
        <label for="explorerQ">Question</label>
        <select id="explorerQ" onchange="explorerUpdate()"></select>
      </div>
      <div class="explorer-field">
        <label for="explorerFilterQ">Cross-tab filter (optional)</label>
        <select id="explorerFilterQ" onchange="explorerUpdateFilter()"></select>
      </div>
      <div class="explorer-field" id="explorerFilterValWrap" style="display:none;">
        <label for="explorerFilterVal">Filter value</label>
        <select id="explorerFilterVal" onchange="explorerUpdate()"></select>
      </div>
      <button class="explorer-clear" onclick="explorerClear()">Clear</button>
    </div>
    <div class="explorer-result" id="explorerResult">
      <div class="explorer-empty">Pick a question above to explore the data.</div>
    </div>
  </div>

  <!-- Aggregations -->
  <div id="sectionFilter" class="section-filter"></div>
  <div id="charts"></div>

  </div><!-- /tab-dashboard -->

  <!-- Responses tab -->
  <div id="tab-responses" class="tab-content">

  <!-- Response table -->
  <div class="panel">
    <div class="panel-hdr">
      Individual Responses
      <a href="#" id="csvLink">Download CSV ↓</a>
    </div>
    <div class="panel-body">
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search responses…" oninput="filterTable()" />
        <button class="btn-outline" onclick="clearSearch()">Clear</button>
        <label style="margin-left:auto;font-size:10pt;display:flex;align-items:center;gap:0.3rem;cursor:pointer;">
          <input type="checkbox" id="latestOnly" checked onchange="toggleLatestOnly()" />
          Latest per person only
        </label>
      </div>
      <div class="tbl-wrap">
        <table id="respTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Country</th>
              <th>Sub</th>
              <th>Time (min)</th>
              <th>Sections</th>
              <th>NPS</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="respBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  </div><!-- /tab-responses -->

</div>

<script>
const WORKER = "https://temple-shalom-survey.jeffstein.workers.dev";
let allResponses = [];
let exportKey    = "";
let latestOnly   = true;

// ── SVG icons (defined once, reused everywhere) ──────────────────────────────
const SVG_BOTH = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="9" width="3" height="6"/><rect x="6" y="5" width="3" height="10"/><circle cx="12" cy="6" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.5 A3.5 3.5 0 0 1 15.5 6 L12 6 Z"/></svg>';
const SVG_BAR  = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="9" width="3" height="6"/><rect x="6" y="5" width="3" height="10"/><rect x="11" y="2" width="3" height="13"/></svg>';
const SVG_PIE  = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1 A7 7 0 0 1 15 8 L8 8 Z"/></svg>';

// ── Chart type toggle button helper ──────────────────────────────────────────
function chartToggleHTML(prefix, qName, current) {
  const a = (t) => current === t ? "active" : "";
  return `<div class="chart-toggle" style="margin-bottom:0.5rem;">
    <button class="${a('both')}" onclick="${prefix}('${qName}','both')" title="Both charts">${SVG_BOTH}</button>
    <button class="${a('bar')}" onclick="${prefix}('${qName}','bar')" title="Bar chart">${SVG_BAR}</button>
    <button class="${a('pie')}" onclick="${prefix}('${qName}','pie')" title="Pie chart">${SVG_PIE}</button>
  </div>`;
}

function switchTab(name, btn) {
  document.querySelectorAll(".tab-bar button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  if (btn) btn.classList.add("active");
}

// ── Auth ─────────────────────────────────────────────────────────────────────

const urlKey = new URLSearchParams(location.search).get("key");
if (urlKey) {
  document.getElementById("keyInput").value = urlKey;
  setTimeout(doAuth, 0);
}

function doAuth() {
  const key = document.getElementById("keyInput").value.trim();
  if (!key) return;
  exportKey = key;
  document.getElementById("authError").textContent = "";
  loadData(key);
}

document.getElementById("keyInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doAuth();
});

// ── Load data ─────────────────────────────────────────────────────────────────

async function loadData(key) {
  try {
    const [res] = await Promise.all([
      fetch(`${WORKER}/results?key=${encodeURIComponent(key)}`),
      loadSurveyDef(),
    ]);
    if (res.status === 401) {
      document.getElementById("authError").textContent = "Invalid key. Try again.";
      return;
    }
    const data = await res.json();
    allResponses = data.responses || [];

    document.getElementById("authScreen").style.display = "none";
    document.getElementById("dashboard").style.display  = "block";

    latestOnly = document.getElementById("latestOnly").checked;
    invalidateLatestCache();
    const displayResponses = getDisplayResponses();

    document.getElementById("hdrSub").textContent =
      `${uniqueRespondentCount()} respondent${uniqueRespondentCount() !== 1 ? "s" : ""} · ${allResponses.length} total submission${allResponses.length !== 1 ? "s" : ""} · as of ${new Date().toLocaleString()}`;

    document.getElementById("csvLink").href = `${WORKER}/export?key=${encodeURIComponent(key)}`;
    document.getElementById("csvLink").download = "responses.csv";

    renderStats(displayResponses);
    initExplorer();
    renderCharts(displayResponses);
    renderTable(displayResponses);
  } catch (e) {
    document.getElementById("authError").textContent = "Error: " + e.message;
  }
}

// ── Helpers: latest per person (cached) ──────────────────────────────────────

let _latestCache = null;
let _latestCacheKey = null;

function invalidateLatestCache() { _latestCache = null; }

function getLatestPerPerson(responses) {
  const bySession = new Map();
  for (const r of responses) {
    const key = r.session_id || r.response_id;
    const existing = bySession.get(key);
    if (!existing || new Date(r.timestamp) > new Date(existing.timestamp)) {
      bySession.set(key, r);
    }
  }
  return [...bySession.values()];
}

function getDisplayResponses() {
  if (!latestOnly) return allResponses;
  if (!_latestCache) _latestCache = getLatestPerPerson(allResponses);
  return _latestCache;
}

function uniqueRespondentCount() {
  return new Set(allResponses.map(x => x.session_id).filter(Boolean)).size;
}

function toggleLatestOnly() {
  latestOnly = document.getElementById("latestOnly").checked;
  invalidateLatestCache();
  const dr = getDisplayResponses();
  renderStats(dr);
  renderCharts(dr);
  renderTable(dr);
}

// ── Stats cards ───────────────────────────────────────────────────────────────

function renderStats(responses) {
  const npsVals = responses.map(x => x.answers?.q_nps).filter(v => v != null);
  const nps = calcNPS(npsVals);
  const avgMin = responses.filter(x => x.completion_seconds)
    .reduce((s, x, _, a) => s + x.completion_seconds / a.length, 0) / 60;
  const resubmits = allResponses.filter(x => (x.submission_number || 1) > 1).length;

  const cards = [
    { val: responses.length, lbl: latestOnly ? "Unique Respondents" : "Total Responses" },
    { val: nps != null ? nps : "—", lbl: "NPS Score", extra: npsBar(npsVals) },
    { val: avgMin ? avgMin.toFixed(1) + "m" : "—", lbl: "Avg Completion" },
    { val: resubmits, lbl: "Re-submissions" },
  ];

  document.getElementById("statRow").innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="val">${c.val}</div>
      <div class="lbl">${c.lbl}</div>
      ${c.extra || ""}
    </div>
  `).join("");
}

function calcNPS(vals) {
  if (!vals.length) return null;
  const promoters  = vals.filter(v => v >= 9).length;
  const detractors = vals.filter(v => v <= 6).length;
  return Math.round((promoters - detractors) / vals.length * 100);
}

function npsBar(vals) {
  if (!vals.length) return "";
  const n = vals.length;
  const p = vals.filter(v => v >= 9).length / n * 100;
  const pa = vals.filter(v => v === 7 || v === 8).length / n * 100;
  const d = vals.filter(v => v <= 6).length / n * 100;
  return `<div class="nps-bar-wrap">
    <div class="seg detract" style="flex:${d}"></div>
    <div class="seg passive" style="flex:${pa}"></div>
    <div class="seg promote" style="flex:${p}"></div>
  </div><div style="font-size:8pt;color:#888;margin-top:2px">${Math.round(d)}% detractors · ${Math.round(pa)}% passives · ${Math.round(p)}% promoters</div>`;
}

// ── Survey definition & question lookups (cached) ─────────────────────────────

let surveyDef = null;
let _allQuestions = null;       // flat list of original questions
let _explorerQuestions = null;  // matrix rows expanded into sub-questions

async function loadSurveyDef() {
  if (surveyDef) return surveyDef;
  try {
    const res = await fetch("survey.json");
    surveyDef = await res.json();
  } catch {
    surveyDef = { pages: [] };
  }
  _allQuestions = null;
  _explorerQuestions = null;
  qNumberMap = {};
  return surveyDef;
}

function getAllQuestions() {
  if (_allQuestions) return _allQuestions;
  if (!surveyDef) return [];
  _allQuestions = [];
  surveyDef.pages.forEach((page, pageIdx) => {
    (page.elements || []).forEach(q => {
      _allQuestions.push({ ...q, sectionTitle: page.title || `Section ${pageIdx + 1}`, pageIdx });
    });
  });
  return _allQuestions;
}

function getAllExplorerQuestions() {
  if (_explorerQuestions) return _explorerQuestions;
  if (!surveyDef) return [];
  _explorerQuestions = [];
  surveyDef.pages.forEach((page, pageIdx) => {
    const sectionTitle = page.title || `Section ${pageIdx + 1}`;
    (page.elements || []).forEach(q => {
      if (q.type === "matrix" && q.rows) {
        q.rows.forEach(row => {
          const rowVal = row.value || row;
          _explorerQuestions.push({
            ...q,
            name: q.name + "|" + rowVal,
            title: row.text || row.value || rowVal,
            type: "radiogroup",
            choices: q.columns || [],
            sectionTitle, pageIdx,
            _matrixParent: q.name,
            _matrixRow: rowVal,
          });
        });
      } else {
        _explorerQuestions.push({ ...q, sectionTitle, pageIdx });
      }
    });
  });
  return _explorerQuestions;
}

function findQuestion(name) {
  return getAllQuestions().find(q => q.name === name);
}

// Resolve a question by explorer name (may be "qName|rowVal" for matrix rows)
function resolveQuestion(qName) {
  if (!qName) return null;
  if (!qName.includes("|")) return findQuestion(qName);
  const [parentName, rowVal] = qName.split("|");
  const parent = findQuestion(parentName);
  if (!parent) return null;
  const row = (parent.rows || []).find(r => (r.value || r) === rowVal);
  return {
    ...parent,
    name: qName,
    title: row ? (row.text || row.value || rowVal) : rowVal,
    type: "radiogroup",
    choices: parent.columns || [],
    _matrixParent: parentName,
    _matrixRow: rowVal,
  };
}

// Extract a question's answer value from a response (handles matrix rows)
function getAnswerValue(q, r) {
  if (q._matrixParent && q._matrixRow) {
    const ma = r.answers?.[q._matrixParent];
    return ma && typeof ma === "object" ? ma[q._matrixRow] : null;
  }
  return r.answers?.[q.name];
}

// ── Question numbering (letter suffixes for conditional follow-ups) ───────────

let qNumberMap = {};
let qRowNumberMap = {};

// Conditional questions that get letter suffixes instead of their own number
const SUB_QUESTIONS = {
  'q4_ada_limits':           'q3_ada',
  'q13_children_activities': 'q12_children',
  'q_contact_request':       'q_contact_phone',
};

function buildQNumberMap() {
  if (qNumberMap._built) return;
  qNumberMap = {};
  qRowNumberMap = {};
  if (!surveyDef) return;
  let n = 0;
  const subLetter = {};
  surveyDef.pages.forEach(page => {
    (page.elements || []).forEach(q => {
      const parent = SUB_QUESTIONS[q.name];
      if (parent) {
        subLetter[parent] = (subLetter[parent] || 0) + 1;
        const letter = String.fromCharCode(97 + subLetter[parent] - 1);
        qNumberMap[q.name] = qNumberMap[parent] + letter;
      } else {
        n++;
        qNumberMap[q.name] = String(n);
      }
      const baseNum = qNumberMap[q.name];
      if (q.type === "matrix" && q.rows) {
        q.rows.forEach((row, i) => {
          qRowNumberMap[q.name + "|" + (row.value || row)] = `Q${baseNum}.${i + 1}`;
        });
      }
    });
  });
  qNumberMap._built = true;
}

function qNum(name) { return qNumberMap[name] ? `Q${qNumberMap[name]}` : ""; }
function qRowNum(qName, rowVal) { return qRowNumberMap[qName + "|" + rowVal] || ""; }
function qNumFor(q) { return q._matrixParent ? qRowNum(q._matrixParent, q._matrixRow) : qNum(q.name); }

// ── Choice/matrix label maps ─────────────────────────────────────────────────

function choiceMap(question) {
  const m = {};
  (question.choices || []).forEach(c => { m[c.value] = c.text || c.value; });
  if (question.hasOther || question.showOtherItem) m["other"] = "Other";
  return m;
}

function matrixLookups(question) {
  const rows = {};
  (question.rows || []).forEach(r => { rows[r.value] = r.text || r.value; });
  const cols = {};
  (question.columns || []).forEach(c => { cols[c.value] = c.text || c.value; });
  return { rows, cols, colOrder: (question.columns || []).map(c => c.value) };
}

// ── Sentiment colors ──────────────────────────────────────────────────────────

const SENTIMENT_MAP = {
  "very_satisfied": 5, "satisfied": 4, "neutral": 3, "dissatisfied": 2, "very_dissatisfied": 1,
  "meets_needs": 5, "does_not_meet": 1, "no_opinion": 3,
  "strongly_agree": 5, "agree": 4, "disagree": 2, "strongly_disagree": 1,
  "strength": 5, "meeting_expectations": 3, "weakness": 1, "needs_improvement": 1,
  "very_familiar": 5, "reasonably": 4, "slightly": 2, "not_familiar": 1,
  "regularly": 5, "occasionally": 4, "want_to": 3, "no": 1,
  "monthly": 4, "some": 3, "no_participation": 1,
  "na": "na", "not_aware": "na", "dont_know": "na",
};

function sentimentClass(colValue) {
  const s = SENTIMENT_MAP[colValue];
  if (s === undefined) return "";
  if (s === "na") return "sent-na";
  return `sent-${s}`;
}

const PIE_COLORS = ["#0038b8","#1a5fd4","#4d8ae6","#80b5f0","#b3d5f5","#e6c300","#f9a825","#ef6c00","#c62828","#2e7d32","#558b2f","#7e57c2","#5c6bc0","#8d6e63","#78909c","#26a69a","#ec407a","#ab47bc"];

// ── Data Explorer ─────────────────────────────────────────────────────────────

let chartTypeState = {};

function initExplorer() {
  buildQNumberMap();
  const qs = getAllExplorerQuestions();
  populateExplorerDropdown("explorerQ", qs, "— Pick a question —");
  populateExplorerDropdown("explorerFilterQ", qs, "— No filter —");
}

function populateExplorerDropdown(id, qs, placeholder) {
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="">${placeholder}</option>`;
  let currentSection = "";
  qs.forEach(q => {
    if (q.sectionTitle !== currentSection) {
      currentSection = q.sectionTitle;
      const og = document.createElement("optgroup");
      og.label = currentSection;
      sel.appendChild(og);
    }
    const opt = document.createElement("option");
    opt.value = q.name;
    opt.textContent = `${qNumFor(q)} · ${(q.title || q.name).slice(0, 65)}`;
    sel.lastChild.appendChild(opt);
  });
}

function explorerUpdateFilter() {
  const filterQName = document.getElementById("explorerFilterQ").value;
  const valWrap = document.getElementById("explorerFilterValWrap");
  const valSelect = document.getElementById("explorerFilterVal");

  if (!filterQName) {
    valWrap.style.display = "none";
    explorerUpdate();
    return;
  }

  const q = resolveQuestion(filterQName);
  if (!q) { valWrap.style.display = "none"; return; }

  valWrap.style.display = "flex";
  const labels = choiceMap(q);
  const displayResponses = getDisplayResponses();
  const uniqueVals = new Set();

  displayResponses.forEach(r => {
    const v = getAnswerValue(q, r);
    if (v == null || v === "") return;
    if (q.type === "checkbox") {
      (Array.isArray(v) ? v : [v]).forEach(x => uniqueVals.add(x));
    } else {
      uniqueVals.add(v);
    }
  });

  valSelect.innerHTML = '<option value="">— Any —</option>';
  [...uniqueVals].sort().forEach(val => {
    const opt = document.createElement("option");
    opt.value = val;
    opt.textContent = labels[val] || val;
    valSelect.appendChild(opt);
  });

  explorerUpdate();
}

function explorerUpdate() {
  const qName = document.getElementById("explorerQ").value;
  const result = document.getElementById("explorerResult");

  if (!qName) {
    result.innerHTML = '<div class="explorer-empty">Pick a question above to explore the data.</div>';
    return;
  }

  const q = resolveQuestion(qName);
  if (!q) return;

  let displayResponses = getDisplayResponses();

  // Apply cross-tab filter
  const filterQName = document.getElementById("explorerFilterQ").value;
  const filterVal = document.getElementById("explorerFilterVal").value;
  let filterNote = "";

  if (filterQName && filterVal) {
    const filterQ = resolveQuestion(filterQName);
    if (filterQ) {
      const before = displayResponses.length;
      displayResponses = displayResponses.filter(r => {
        const v = getAnswerValue(filterQ, r);
        if (v == null || v === "") return false;
        if (filterQ.type === "checkbox") return (Array.isArray(v) ? v : [v]).includes(filterVal);
        return v === filterVal;
      });
      const filterLabels = choiceMap(filterQ);
      filterNote = `Filtered to ${filterQ.title || filterQ.name} = "${filterLabels[filterVal] || filterVal}" — ${displayResponses.length} of ${before} responses`;
    }
  }

  if (!displayResponses.length) {
    result.innerHTML = '<div class="explorer-empty">No responses match this filter.</div>';
    return;
  }

  let html = "";
  if (filterNote) html += `<div class="explorer-crosstab-note">${filterNote}</div>`;
  html += `<div class="explorer-subtitle">${displayResponses.length} response${displayResponses.length !== 1 ? "s" : ""}</div>`;

  if (q.type === "radiogroup" || q.type === "checkbox") {
    html += renderChoiceChartHTML(q, displayResponses);
  } else if (q.type === "rating") {
    html += renderRatingChartHTML(q, displayResponses);
  } else if (q.type === "comment" || q.type === "text") {
    html += renderCommentList(q, displayResponses);
  }

  result.innerHTML = html;
}

function setExplorerChartType(qName, type) {
  if (qName) chartTypeState["explorer_" + qName] = type;
  explorerUpdate();
}

function explorerClear() {
  document.getElementById("explorerQ").value = "";
  document.getElementById("explorerFilterQ").value = "";
  document.getElementById("explorerFilterValWrap").style.display = "none";
  document.getElementById("explorerResult").innerHTML = '<div class="explorer-empty">Pick a question above to explore the data.</div>';
}

// ── Chart rendering (HTML-returning versions for explorer + DOM for dashboard) ─

function countChoiceAnswers(q, responses) {
  const labels = choiceMap(q);
  const counts = {};
  let answered = 0;
  responses.forEach(r => {
    const v = getAnswerValue(q, r);
    if (v == null || v === "") return;
    (Array.isArray(v) ? v : [v]).forEach(x => {
      const lbl = labels[x] || x;
      counts[lbl] = (counts[lbl] || 0) + 1;
    });
    answered++;
  });
  return { counts, answered, labels };
}

function sortChoiceCounts(q, counts) {
  const labels = choiceMap(q);
  if (q.choices && q.choices.length) {
    const result = q.choices.map(c => [labels[c.value] || c.value, counts[labels[c.value] || c.value] || 0]);
      // Include "other" if it has counts and the question allows it
      if ((q.hasOther || q.showOtherItem) && counts["Other"]) {
        result.push(["Other", counts["Other"]]);
      }
      return result.filter(([, c]) => c > 0);
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function renderChoiceChartHTML(q, responses) {
  const { counts, answered } = countChoiceAnswers(q, responses);
  if (!Object.keys(counts).length) return '<div class="explorer-empty">No data for this question.</div>';
  const skipped = responses.length - answered;
  const sorted = sortChoiceCounts(q, counts);
  const num = qNumFor(q);
  const chartType = chartTypeState["explorer_" + q.name] || "pie";
  return `<div class="panel-body">
    <div class="response-rate">${num} · ${answered} of ${responses.length} answered (${Math.round(answered/responses.length*100)}%)</div>
    ${chartToggleHTML("setExplorerChartType", q.name, chartType)}
    <div class="${chartType === 'both' ? 'chart-both' : ''}">
      ${chartType !== 'pie' ? `<div class="chart-half">${barChartHTML(sorted, skipped, responses.length)}</div>` : ""}
      ${chartType !== 'bar' ? `<div class="chart-half">${renderPieChartHTML(sorted, skipped)}</div>` : ""}
    </div>
  </div>`;
}

function barChartHTML(sorted, skipped, total) {
  const pct = (c) => Math.round(c / total * 100);
  return sorted.map(([lbl, cnt]) => `
    <div class="bar-item">
      <div class="bar-lbl" title="${lbl}">${lbl}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct(cnt)}%"></div></div>
      <div class="bar-count">${cnt} (${pct(cnt)}%)</div>
    </div>`).join("") +
    (skipped > 0 ? `
      <div class="bar-item no-answer">
        <div class="bar-lbl">No answer</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct(skipped)}%"></div></div>
        <div class="bar-count">${skipped} (${pct(skipped)}%)</div>
      </div>` : "");
}

function renderRatingChartHTML(q, responses) {
  const vals = responses.map(r => r.answers?.[q.name]).filter(v => v != null && v !== "");
  if (!vals.length) return '<div class="explorer-empty">No data for this question.</div>';
  const min = q.rateMin || 0, max = q.rateMax || 10;
  const counts = {};
  for (let i = min; i <= max; i++) counts[i] = 0;
  vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const avg = (vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(1);
  const skipped = responses.length - vals.length;
  const num = qNum(q.name);
  return `<div class="panel-body">
    <div class="response-rate">${num} · ${vals.length} of ${responses.length} answered (${Math.round(vals.length/responses.length*100)}%)</div>
    <div style="font-size:10pt;color:#666;margin-bottom:0.5rem;">Average: <strong>${avg}</strong></div>
    ${barChartHTML(Object.entries(counts), skipped, responses.length)}
  </div>`;
}

function renderCommentList(q, responses) {
  const answers = responses
    .map(r => ({ text: r.answers?.[q.name], date: r.timestamp, sub: r.submission_number }))
    .filter(a => a.text && a.text.trim())
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  const num = qNum(q.name);
  const skipped = responses.length - answers.length;
  if (!answers.length) return `<div class="explorer-empty">${num ? num + " · " : ""}No text answers for this question. (${skipped} of ${responses.length} skipped)</div>`;

  return `<div class="explorer-subtitle">${num ? num + " · " : ""}${answers.length} of ${responses.length} answered (${skipped} skipped)</div>
    <div class="comment-list">
      ${answers.map(a => `
        <div class="comment-item">
          ${escapeHtml(a.text)}
          <div class="comment-meta">${new Date(a.date).toLocaleDateString()}${a.sub > 1 ? " · resubmission #" + a.sub : ""}</div>
        </div>`).join("")}
    </div>`;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// ── Pie chart (SVG) ───────────────────────────────────────────────────────────

function renderPieChartHTML(sorted, skipped) {
  const data = [...sorted];
  if (skipped > 0) data.push(["No answer", skipped]);
  const sum = data.reduce((s, [, c]) => s + c, 0);
  if (sum === 0) return '<div class="explorer-empty">No data</div>';

  const r = 60, cx = 70, cy = 70;
  let angle = -Math.PI / 2;
  let slices = "", legend = "";

  data.forEach(([lbl, cnt], i) => {
    const pct = cnt / sum;
    const endAngle = angle + pct * 2 * Math.PI;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    const largeArc = pct > 0.5 ? 1 : 0;
    const color = lbl === "No answer" ? "#ccc" : PIE_COLORS[i % PIE_COLORS.length];
    slices += pct < 1
      ? `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${color}" stroke="white" stroke-width="1"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" stroke="white" stroke-width="1"/>`;
    legend += `<div class="pie-legend-item"><div class="pie-legend-swatch" style="background:${color}"></div>${lbl}: ${cnt} (${Math.round(pct*100)}%)</div>`;
    angle = endAngle;
  });

  return `<div class="pie-wrap">
    <svg class="pie-svg" width="140" height="140" viewBox="0 0 140 140">${slices}</svg>
    <div class="pie-legend">${legend}</div>
  </div>`;
}

// ── Aggregate charts (dashboard) ──────────────────────────────────────────────

let activeSection = "all";
let currentResponses = [];

function setSectionFilter(section) {
  activeSection = section;
  renderCharts(currentResponses);
}

function setChartType(qName, type) {
  chartTypeState[qName] = type;
  renderCharts(getDisplayResponses());
}

function renderCharts(responses) {
  currentResponses = responses;
  const wrap = document.getElementById("charts");
  const filterBar = document.getElementById("sectionFilter");
  wrap.innerHTML = "";
  filterBar.innerHTML = "";

  if (!surveyDef) { wrap.textContent = "Loading chart definitions…"; return; }
  buildQNumberMap();

  // Section filter buttons
  const allBtn = document.createElement("button");
  allBtn.textContent = "All";
  allBtn.className = activeSection === "all" ? "active" : "";
  allBtn.onclick = () => setSectionFilter("all");
  filterBar.appendChild(allBtn);
  surveyDef.pages.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.textContent = p.title || `Section ${i+1}`;
    btn.className = activeSection === i ? "active" : "";
    btn.onclick = () => setSectionFilter(i);
    filterBar.appendChild(btn);
  });

  surveyDef.pages.forEach((page, pageIdx) => {
    if (activeSection !== "all" && activeSection !== pageIdx) return;
    const chartable = (page.elements || []).filter(q =>
      ["radiogroup", "checkbox", "rating", "matrix"].includes(q.type));
    if (!chartable.length) return;

    const hdr = document.createElement("h3");
    hdr.style.cssText = "grid-column:1/-1;font-size:12pt;color:var(--blue-dark);margin:1.5rem 0 0.5rem;border-bottom:1px solid var(--border);padding-bottom:0.3rem;";
    hdr.textContent = page.title || `Section ${pageIdx + 1}`;
    wrap.appendChild(hdr);

    const grid = document.createElement("div");
    grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:1rem;margin-bottom:1rem;";

    chartable.forEach(q => {
      let panel = null;
      if (q.type === "radiogroup" || q.type === "checkbox") panel = renderChoiceChart(q, responses);
      else if (q.type === "rating") panel = renderRatingChart(q, responses);
      else if (q.type === "matrix") panel = renderMatrixChart(q, responses);
      if (panel) grid.appendChild(panel);
    });

    if (grid.children.length) wrap.appendChild(grid);
  });
}

function renderChoiceChart(q, responses) {
  const { counts, answered } = countChoiceAnswers(q, responses);
  if (!Object.keys(counts).length) return null;
  const skipped = responses.length - answered;
  const sorted = sortChoiceCounts(q, counts);
  const num = qNum(q.name);
  const chartType = chartTypeState[q.name] || "pie";

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="panel-hdr">
      <span>${num ? `<span class="q-num">${num}</span>` : ""}${q.title || q.name}${q.type === "checkbox" ? " <span style='font-weight:400;color:#888;font-size:9pt'>(multi-select)</span>" : ""}</span>
      <div class="chart-toggle" data-q="${q.name}">
        <button class="${chartType === 'both' ? 'active' : ''}" onclick="setChartType('${q.name}','both')" title="Both charts">${SVG_BOTH}</button>
        <button class="${chartType === 'bar' ? 'active' : ''}" onclick="setChartType('${q.name}','bar')" title="Bar chart">${SVG_BAR}</button>
        <button class="${chartType === 'pie' ? 'active' : ''}" onclick="setChartType('${q.name}','pie')" title="Pie chart">${SVG_PIE}</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="response-rate">${answered} of ${responses.length} answered (${Math.round(answered/responses.length*100)}%)</div>
      <div class="${chartType === 'both' ? 'chart-both' : ''}">
        ${chartType !== 'pie' ? `<div class="chart-half">${barChartHTML(sorted, skipped, responses.length)}</div>` : ""}
        ${chartType !== 'bar' ? `<div class="chart-half">${renderPieChartHTML(sorted, skipped)}</div>` : ""}
      </div>
    </div>`;
  return panel;
}

function renderRatingChart(q, responses) {
  const vals = responses.map(r => r.answers?.[q.name]).filter(v => v != null && v !== "");
  if (!vals.length) return null;
  const min = q.rateMin || 0, max = q.rateMax || 10;
  const counts = {};
  for (let i = min; i <= max; i++) counts[i] = 0;
  vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const avg = (vals.reduce((s, v) => s + v, 0) / vals.length).toFixed(1);
  const skipped = responses.length - vals.length;
  const num = qNum(q.name);

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="panel-hdr">${num ? `<span class="q-num">${num}</span>` : ""}${q.title || q.name} <span style="font-weight:400;color:#888;font-size:9pt">(avg: ${avg})</span></div>
    <div class="panel-body">
      <div class="response-rate">${vals.length} of ${responses.length} answered (${Math.round(vals.length/responses.length*100)}%)</div>
      ${barChartHTML(Object.entries(counts), skipped, responses.length)}
    </div>`;
  return panel;
}

function renderMatrixChart(q, responses) {
  const { rows, cols, colOrder } = matrixLookups(q);
  let hasData = false;
  for (const r of responses) {
    if (r.answers?.[q.name] && typeof r.answers[q.name] === "object") { hasData = true; break; }
  }
  if (!hasData) return null;

  const num = qNum(q.name);
  const chartType = chartTypeState[q.name] || "pie";
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.style.gridColumn = "span 2";

  let html = `<div class="panel-hdr">
    <span>${num ? `<span class="q-num">${num}</span>` : ""}${q.title || q.name}</span>
    <div class="chart-toggle" data-q="${q.name}">
      <button class="${chartType === 'pie' ? 'active' : ''}" onclick="setChartType('${q.name}','pie')" title="Pie chart">${SVG_PIE}</button>
      <button class="${chartType === 'bar' ? 'active' : ''}" onclick="setChartType('${q.name}','bar')" title="Bar chart">${SVG_BAR}</button>
    </div>
  </div>
  <div class="panel-body">
    <div class="matrix-pie-grid">`;

  for (const [rowVal, rowLabel] of Object.entries(rows)) {
    const counts = {};
    let total = 0;
    responses.forEach(r => {
      const v = r.answers?.[q.name];
      if (!v || typeof v !== "object") return;
      const cell = v[rowVal];
      if (cell == null || cell === "") return;
      const lbl = cols[cell] || cell;
      counts[lbl] = (counts[lbl] || 0) + 1;
      total++;
    });

    const rowNum = qRowNum(q.name, rowVal);
    const skipped = responses.length - total;

    if (total === 0) {
      html += `<div class="matrix-pie-cell">
        <div class="matrix-pie-title">${rowNum} · ${rowLabel} <span class="matrix-pie-count">0/${responses.length}</span></div>
        <div class="explorer-empty" style="padding:0.5rem;">No answers</div>
      </div>`;
      continue;
    }

    const sorted = colOrder
      .map(colVal => [cols[colVal] || colVal, counts[cols[colVal] || colVal] || 0])
      .filter(([, c]) => c > 0);

    if (chartType === "pie") {
      html += `<div class="matrix-pie-cell">
        <div class="matrix-pie-title">${rowNum} · ${rowLabel} <span class="matrix-pie-count">${total}/${responses.length}</span></div>
        ${renderPieChartHTML(sorted, skipped)}
      </div>`;
    } else {
      html += `<div class="matrix-pie-cell">
        <div class="matrix-pie-title">${rowNum} · ${rowLabel} <span class="matrix-pie-count">${total}/${responses.length}</span></div>
        ${sorted.map(([lbl, cnt]) => {
          const colVal = colOrder.find(cv => (cols[cv] || cv) === lbl);
          return `<div class="bar-item"><div class="bar-lbl" title="${lbl}">${lbl}</div><div class="bar-track"><div class="bar-fill ${sentimentClass(colVal)}" style="width:${Math.round(cnt/responses.length*100)}%"></div></div><div class="bar-count">${cnt}</div></div>`;
        }).join("")}
        ${skipped > 0 ? `<div class="bar-item no-answer"><div class="bar-lbl">No answer</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(skipped/responses.length*100)}%"></div></div><div class="bar-count">${skipped}</div></div>` : ""}
      </div>`;
    }
  }

  html += `</div></div>`;
  panel.innerHTML = html;
  return panel;
}

// ── Response table ────────────────────────────────────────────────────────────

function renderTable(rows) {
  const tbody = document.getElementById("respBody");
  tbody.innerHTML = "";
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">No responses yet.</td></tr>`;
    return;
  }

  rows.forEach((r, idx) => {
    const date = r.timestamp ? new Date(r.timestamp).toLocaleString() : "—";
    const mins = r.completion_seconds ? (r.completion_seconds / 60).toFixed(1) + " min" : "—";
    const secs = Array.isArray(r.sections_answered) ? r.sections_answered.length : "—";
    const nps = r.answers?.q_nps ?? "—";
    const country = r.ip_country || "—";
    const subNum = r.submission_number || 1;
    const subBadge = subNum > 1
      ? `<span class="badge" style="background:#fff3cd;color:#856404;border:1px solid #ffc107;">#${subNum}</span>`
      : `<span style="color:#aaa;">1</span>`;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="color:#888">${r.id}</td>
      <td>${date}</td>
      <td><span class="badge badge-us">${country}</span></td>
      <td>${subBadge}</td>
      <td>${mins}</td>
      <td>${secs}</td>
      <td>${nps !== "—" ? nps + "/10" : "—"}</td>
      <td><button class="expand-btn" data-idx="${idx}" onclick="toggleDetail(this)">▶ Details</button></td>`;
    tbody.appendChild(tr);

    const det = document.createElement("tr");
    det.className = "detail-row";
    det.style.display = "none";
    det.dataset.for = idx;

    const answers = r.answers || {};
    const pairs = Object.entries(answers);
    const meta = [
      ["session_id", r.session_id],
      ["submission_number", r.submission_number],
      ["previous_response_id", r.previous_response_id],
      ["referrer", r.referrer],
      ["survey_version", r.survey_version],
    ].filter(([, v]) => v);

    det.innerHTML = `<td colspan="8">
      <div class="detail-grid">
        ${meta.length ? meta.map(([k, v]) => `
          <div><span class="dk">${k}</span><br/><span class="dv" style="font-size:8pt;color:#666;">${v}</span></div>
        `).join("") : ""}
        ${pairs.length ? pairs.map(([k, v]) => `
          <div><span class="dk">${k}</span><br/><span class="dv">${Array.isArray(v) ? v.join(", ") : (typeof v === "object" ? Object.entries(v).map(([rk, rv]) => `${rk}: ${rv}`).join("; ") : v)}</span></div>
        `).join("") : "<em>No answers recorded.</em>"}
      </div>
    </td>`;
    tbody.appendChild(det);
  });
}

function toggleDetail(btn) {
  const detRow = document.querySelector(`.detail-row[data-for="${btn.dataset.idx}"]`);
  const open = detRow.style.display !== "none";
  detRow.style.display = open ? "none" : "table-row";
  btn.textContent = open ? "▶ Details" : "▼ Hide";
}

function filterTable() {
  const q = document.getElementById("searchBox").value.toLowerCase();
  const base = getDisplayResponses();
  if (!q) { renderTable(base); return; }
  renderTable(base.filter(r => JSON.stringify(r).toLowerCase().includes(q)));
}

function clearSearch() {
  document.getElementById("searchBox").value = "";
  renderTable(getDisplayResponses());
}
</script>
</body>
</html>
