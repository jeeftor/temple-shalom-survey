<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temple Shalom Member Survey 2026</title>

  <!-- SurveyJS -->
  <link href="https://unpkg.com/survey-core@1.12.13/defaultV2.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/survey-core@1.12.13/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-js-ui@1.12.13/survey-js-ui.min.js"></script>

  <style>
    /* ── Israeli flag palette ────────────────────────────────── */
    :root {
      --blue:       #0038b8;
      --blue-dark:  #00277d;
      --blue-mid:   #1a4fcc;
      --blue-light: #dce8ff;
      --blue-faint: #f0f5ff;
      --white:      #ffffff;
      --text:       #1a1a2e;
      --text-muted: #555566;
      --border:     #c5d5f0;
      --radius:     6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f7ff;
      color: var(--text);
      font-size: 16px;
      overflow-x: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      background: var(--blue-dark);
      color: var(--white);
      padding: 1.4rem 2rem;
      border-bottom: 4px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    header p  { font-size: 0.88rem; opacity: 0.8; margin-top: 0.3rem; }
    #printBtn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1.5px solid rgba(255,255,255,0.5);
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #printBtn:hover { background: rgba(255,255,255,0.28); }

    /* ── Section nav ─────────────────────────────────────────── */
    #sectionNav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,56,184,0.08);
    }
    #sectionNavInner {
      max-width: 1100px;
      margin: 0 auto;
    }
    /* Progress bar */
    #surveyProgress {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    #progressLabel { white-space: nowrap; font-weight: 600; }
    #progressTrack {
      flex: 1;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    #progressFill {
      height: 100%;
      background: var(--blue);
      border-radius: 3px;
      transition: width 0.3s ease;
      width: 0%;
    }
    #progressPct { white-space: nowrap; }
    /* Pills: flex-wrap instead of fixed grid so they don't squish */
    #sectionPills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    #sectionSelect { display: none; }
    .nav-pill {
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-pill:hover        { color: var(--blue); background: var(--blue-faint); border-color: var(--blue-light); }
    .nav-pill.active       { background: var(--blue); color: var(--white); font-weight: 700; border-color: var(--blue); }
    .nav-pill.done         { color: #2e7d32; background: #f0faf0; border-color: #a5d6a7; }
    .nav-pill.done::before { content: "\2713 "; font-weight: 700; }
    .nav-pill.done:hover   { background: #e0f5e0; }

    /* ── Main layout ─────────────────────────────────────────── */
    #main {
      max-width: 820px;
      margin: 1.5rem auto 4rem;
      padding: 0 1rem;
      overflow-x: hidden !important;
    }
    #surveyIntro {
      white-space: pre-line;
      background: var(--white);
      border-left: 4px solid var(--blue);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-muted);
      line-height: 1.55;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 4px rgba(0,56,184,0.08);
    }
    #surveyIntro[hidden] { display: none; }
    #draftNotice {
      background: var(--white);
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 16px rgba(0,56,184,0.12);
    }
    #draftNotice[hidden], #draftStatus[hidden] { display: none; }
    #draftNotice h2 { color: var(--blue-dark); font-size: 1.15rem; margin-bottom: 0.5rem; }
    #draftNotice p { color: var(--text-muted); line-height: 1.5; }
    #draftActions { display: flex; gap: 0.75rem; margin-top: 1rem; }
    #draftActions button {
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    #resumeDraftBtn { background: var(--blue); color: var(--white); }
    #startOverBtn { background: var(--white); color: var(--blue); }
    #draftStatus { color: var(--text-muted); font-size: 0.78rem; text-align: right; margin-bottom: 0.5rem; }

    /* Skip / action bar */
    #actionBar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.5rem;
    }
    #actionBar[hidden] { display: none; }
    #skipBtn {
      padding: 0.4rem 1.1rem;
      background: transparent;
      border: 2px solid var(--blue);
      color: var(--blue);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    #skipBtn:hover { background: var(--blue); color: var(--white); }
    #skipBtn.hidden { visibility: hidden; }

    /* ── SurveyJS overrides ──────────────────────────────────── */

    /* Page title */
    .sd-page__title {
      color: var(--blue-dark) !important;
      font-size: 1.25rem !important;
      font-weight: 700 !important;
      border-bottom: 3px solid var(--blue) !important;
      padding-bottom: 0.5rem !important;
    }

    /* Page description (OPTIONAL notice) */
    .sd-page__description {
      background: var(--blue-faint) !important;
      border-left: 4px solid var(--blue) !important;
      padding: 0.65rem 1rem !important;
      border-radius: 0 var(--radius) var(--radius) 0 !important;
      font-size: 0.88rem !important;
      color: var(--text-muted) !important;
      margin-top: 0.5rem !important;
    }

    /* Question title */
    .sd-question__title {
      font-size: 1rem !important;
      font-weight: 600 !important;
      color: var(--text) !important;
    }
    .custom-q-num {
      color: var(--blue);
      font-weight: 700;
      margin-right: 0.4rem;
    }

    /* ── Progress bar (buttons style with labels) ───────────── */
    /* Container */
    .sd-progress-buttons {
      padding: 1rem 2rem 0.5rem !important;
    }
    .sd-progress-buttons__list {
      gap: 0 !important;
    }
    .sd-progress-buttons__list-element {
      flex: 1 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      position: relative !important;
      cursor: pointer !important;
    }
    /* The dot button */
    .sd-progress-buttons__button {
      width: 16px !important;
      height: 16px !important;
      border-radius: 50% !important;
      border: 2px solid #ccc !important;
      background: white !important;
      position: relative !important;
      z-index: 1 !important;
      transition: all 0.2s !important;
    }
    .sd-progress-buttons__button--passed {
      background: var(--blue) !important;
      border-color: var(--blue) !important;
    }
    .sd-progress-buttons__button--current {
      border-color: var(--blue) !important;
      box-shadow: 0 0 0 3px var(--blue-light) !important;
      background: white !important;
    }
    .sd-progress-buttons__list-element:hover .sd-progress-buttons__button {
      border-color: var(--blue) !important;
    }
    /* Connector line */
    .sd-progress-buttons__connector {
      background: #ccc !important;
      height: 2px !important;
    }
    .sd-progress-buttons__connector--passed {
      background: var(--blue) !important;
    }
    /* Page title label under the dot */
    .sd-progress-buttons__page-title {
      font-size: 0.65rem !important;
      color: #888 !important;
      text-align: center !important;
      margin-top: 5px !important;
      max-width: 72px !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      font-family: -apple-system, sans-serif !important;
      font-weight: 500 !important;
    }
    .sd-progress-buttons__list-element--current .sd-progress-buttons__page-title {
      color: var(--blue-dark) !important;
      font-weight: 700 !important;
    }
    .sd-progress-buttons__list-element--passed .sd-progress-buttons__page-title {
      color: var(--blue) !important;
    }
    /* Hide the verbose "Page X of N" text since the dots show this */
    .sd-progress-buttons__page-description { display: none !important; }
    .sd-progress__text { font-size: 0.72rem !important; color: #999 !important; }

    /* Matrix — constrain to container, scroll only within matrix */
    .sd-question__content,
    .sd-panel__content,
    .sd-body__page {
      overflow: hidden !important;
      max-width: 100% !important;
    }
    .sd-question--table .sd-question__content {
      overflow: visible !important;
    }
    /* Matrix wrapper scrolls horizontally if needed */
    .sd-matrix {
      max-width: 100% !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
    }
    .sd-matrix table {
      width: 100% !important;
      max-width: 100% !important;
      table-layout: fixed !important;
    }
    /* Row label: capped so radio columns always fit */
    .sd-matrix thead th:first-child,
    .sd-matrix td:first-child {
      max-width: 200px !important;
      min-width: 110px !important;
      width: 28% !important;
    }
    .sd-matrix th:not(:first-child),
    .sd-matrix td:not(:first-child) {
      min-width: 0 !important;
      width: auto !important;
    }
    /* Matrix rows — better contrast */
    .sd-matrix tr:nth-child(even),
    .sd-matrix__row:nth-child(even) {
      background: var(--blue-faint) !important;
    }
    .sd-matrix__cell, .sd-matrix th {
      padding: 0.5rem 0.4rem !important;
      vertical-align: middle !important;
      text-align: center !important;
    }
    /* Row label left-aligned */
    .sd-matrix__cell:first-child {
      text-align: left !important;
      padding-left: 0.6rem !important;
    }
    .sd-matrix__row-text {
      font-size: 0.88rem !important;
      font-weight: 500 !important;
      color: var(--text) !important;
      line-height: 1.3 !important;
    }
    .sd-matrix thead th {
      background: var(--blue) !important;
      color: var(--white) !important;
      font-size: 0.78rem !important;
      font-weight: 600 !important;
      padding: 0.5rem 0.3rem !important;
      text-align: center !important;
      word-break: break-word !important;
      white-space: normal !important;
      line-height: 1.2 !important;
    }
    [data-name="q14_comm_usefulness"] .sd-matrix thead th {
      font-size: 0.72rem !important;
      overflow-wrap: normal !important;
      white-space: normal !important;
      word-break: normal !important;
    }
    /* Center the radio inside matrix cells */
    .sd-matrix__cell .sd-radio {
      justify-content: center !important;
    }

    /* Radio / checkbox items — bigger hit targets */
    .sd-radio__decorator,
    .sd-checkbox__decorator {
      width: 22px !important;
      height: 22px !important;
      border: 2px solid var(--blue) !important;
    }
    .sd-radio--checked .sd-radio__decorator,
    .sd-checkbox--checked .sd-checkbox__decorator {
      background: var(--blue) !important;
      border-color: var(--blue) !important;
    }
    .sd-radio__label,
    .sd-checkbox__label {
      font-size: 0.95rem !important;
      line-height: 1.4 !important;
    }
    .sd-selectbase__item {
      padding: 0.35rem 0 !important;
    }

    /* Buttons */
    .sd-btn {
      background: var(--blue) !important;
      border-color: var(--blue) !important;
      border-radius: var(--radius) !important;
      font-size: 0.95rem !important;
      padding: 0.6rem 1.5rem !important;
    }
    .sd-btn:hover {
      background: var(--blue-dark) !important;
      border-color: var(--blue-dark) !important;
    }
    .sd-btn--action { background: var(--blue) !important; }

    /* Progress bar */
    .sd-progress { background: var(--blue-light) !important; }
    .sd-progress__bar { background: var(--blue) !important; }

    /* Rating (NPS) */
    .sd-rating__item-text { font-size: 0.9rem !important; }
    .sd-rating__item--selected .sd-rating__item-text {
      background: var(--blue) !important;
      color: var(--white) !important;
    }

    /* Text / comment inputs */
    .sd-input, .sd-comment {
      border: 1.5px solid var(--border) !important;
      border-radius: var(--radius) !important;
      font-size: 0.95rem !important;
    }
    .sd-input:focus, .sd-comment:focus {
      border-color: var(--blue) !important;
      box-shadow: 0 0 0 3px rgba(0,56,184,0.15) !important;
    }

    /* ── Status messages ─────────────────────────────────────── */
    #submitStatus {
      margin: 1rem 0;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      display: none;
    }
    #submitStatus.sending { display:block; background:#f0f5ff; color: var(--blue); border: 1px solid var(--blue-light); }
    #submitStatus.success { display:block; background:#f0faf0; color: #2e7d32; border: 1px solid #a5d6a7; font-weight:600; }
    #submitStatus.error   { display:block; background:#fff0f0; color: #b00020; border: 1px solid #ffcdd2; font-weight:600; }

    /* ── Version footer ──────────────────────────────────────── */
    #versionFooter {
      text-align: center;
      font-size: 0.78rem;
      color: #777;
      padding: 1.5rem 1rem 2rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
      background: var(--blue-faint);
    }
    #versionFooter a { color: #aaa; text-decoration: none; }
    #versionFooter a:hover { text-decoration: underline; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 1rem; }
      header h1 { font-size: 1.2rem; }
      header p  { font-size: 0.78rem; }
      #printBtn { font-size: 0.75rem; padding: 0.35rem 0.8rem; }

      /* Nav: horizontal scroll instead of wrapping */
      #sectionNav { padding: 0.5rem 0.75rem; }
      #sectionPills { display: none; }
      #sectionSelect {
        display: block;
        width: 100%;
        padding: 0.65rem 0.75rem;
        border: 1.5px solid var(--blue);
        border-radius: var(--radius);
        background: var(--white);
        color: var(--blue-dark);
        font-size: 0.9rem;
        font-weight: 700;
      }

      #main { padding: 0 0.75rem; margin-top: 1rem; }
      #surveyIntro { font-size: 0.88rem; padding: 0.85rem 1rem; }
      #draftActions { flex-direction: column; }
      #draftActions button { width: 100%; }
      .sd-progress-buttons { padding: 0.75rem 0.5rem 0.25rem !important; }

      /* ── Matrix → stacked card layout on mobile ─────────────── */
      /* Each row becomes a card; columns become vertical options */
      .sd-matrix {
        overflow-x: visible !important;
        display: block !important;
      }
      .sd-matrix table {
        min-width: 0 !important;
        width: 100% !important;
        display: block !important;
      }
      /* Hide the thead — we'll label each option inline */
      .sd-matrix thead { display: none !important; }

      /* Each <tbody> is a container; each <tr> is a card */
      .sd-matrix tbody,
      .sd-matrix > tr {
        display: block !important;
      }
      .sd-matrix tr {
        display: block !important;
        border: 1px solid var(--border) !important;
        border-radius: var(--radius) !important;
        margin-bottom: 0.6rem !important;
        padding: 0 !important;
        background: var(--white) !important;
      }
      .sd-matrix tr:nth-child(even) { background: var(--white) !important; }

      /* Row label = card header */
      .sd-matrix td:first-child,
      .sd-matrix__cell:first-child {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        padding: 0.6rem 0.75rem !important;
        background: var(--blue-faint) !important;
        border-bottom: 1px solid var(--border) !important;
        border-radius: var(--radius) var(--radius) 0 0 !important;
        font-weight: 600 !important;
        font-size: 0.9rem !important;
        text-align: left !important;
      }

      /* Remaining cells = vertical option list */
      .sd-matrix td:not(:first-child),
      .sd-matrix__cell:not(:first-child) {
        display: flex !important;
        align-items: center !important;
        width: auto !important;
        padding: 0.4rem 0.75rem !important;
        border: none !important;
        text-align: left !important;
      }
      .sd-matrix td:not(:first-child) .sd-radio,
      .sd-matrix__cell:not(:first-child) .sd-radio {
        justify-content: flex-start !important;
      }
      /* Show column label text before each radio (injected via JS) */
      .sd-matrix__cell .mobile-col-label {
        display: inline !important;
        font-size: 0.82rem !important;
        color: var(--text-muted) !important;
        margin-left: 0.4rem !important;
      }

      /* SurveyJS progress bar dots — smaller, scrollable */
      .sd-progress-buttons__list {
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .sd-progress-buttons__list::-webkit-scrollbar { display: none; }
      .sd-progress-buttons__page-title {
        font-size: 0.6rem !important;
        max-width: 50px !important;
      }

      /* Bigger touch targets for radio/checkbox */
      .sd-selectbase__item { padding: 0.5rem 0 !important; }
      .sd-radio__decorator, .sd-checkbox__decorator {
        width: 24px !important; height: 24px !important;
      }

      /* Comment boxes — full width, comfortable height */
      .sd-comment { min-height: 100px !important; }

      /* Buttons — full width on mobile */
      .sd-btn {
        width: 100% !important;
        padding: 0.8rem !important;
        font-size: 1rem !important;
        margin-top: 0.5rem !important;
      }
      .sd-navigation__complete { margin-top: 1rem !important; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Temple Shalom Member Survey 2026</h1>
    <p>Colorado Springs, Colorado &nbsp;·&nbsp; Confidential</p>
  </div>
  <a id="printBtn" href="print.html" target="_blank">🖨 Print Version</a>
</header>

<!-- Clickable section navigation -->
<nav id="sectionNav" aria-label="Survey sections">
  <div id="sectionNavInner">
    <div id="surveyProgress">
      <span id="progressLabel">Section 1 of 7</span>
      <div id="progressTrack"><div id="progressFill"></div></div>
      <span id="progressPct">0%</span>
    </div>
    <select id="sectionSelect" aria-label="Current survey section"></select>
    <div id="sectionPills"></div>
  </div>
</nav>

<div id="main">
  <div id="surveyIntro" hidden></div>
  <div id="draftNotice" hidden>
    <h2>Continue your saved survey?</h2>
    <p id="draftMessage"></p>
    <div id="draftActions">
      <button id="resumeDraftBtn" type="button">Resume saved survey</button>
      <button id="startOverBtn" type="button">Start over</button>
    </div>
  </div>
  <div id="draftStatus" hidden></div>
  <div id="actionBar">
    <button id="skipBtn" class="hidden">Skip this section &rarr;</button>
  </div>
  <div id="submitStatus"></div>
  <div id="surveyContainer"></div>
</div>

<div id="versionFooter">Loading version…</div>

<script>
  // ── Config ──────────────────────────────────────────────────
  const SUBMIT_URL = "https://temple-shalom-survey.jeffstein.workers.dev/submit";

  // ── Already-submitted guard ──────────────────────────────────
  const SUBMITTED_KEY = "ts_survey_submitted_2026";
  const DRAFT_KEY = "ts_survey_draft_2026";
  const PAGE_KEY = "ts_survey_page_2026";
  const RESUBMIT_KEY = "ts_survey_resubmit_2026";
  const DRAFT_TTL_MS = 30 * 24 * 60 * 60 * 1000;
  const alreadySubmitted = Boolean(localStorage.getItem(SUBMITTED_KEY));
  let allowResubmit = false;

  // Check if we were in the middle of a resubmission and have a draft to resume
  const resubmitInProgress = Boolean(localStorage.getItem(RESUBMIT_KEY));
  let savedDraft = null;
  try {
    savedDraft = JSON.parse(localStorage.getItem(DRAFT_KEY));
  } catch {}
  const hasValidDraft = savedDraft && (Date.now() - savedDraft.savedAt < DRAFT_TTL_MS);

  function showAlreadySubmittedNotice() {
    // Clean up stale resubmit flag if draft expired
    if (resubmitInProgress && !hasValidDraft) {
      localStorage.removeItem(RESUBMIT_KEY);
    }
    // If we have a draft from an in-progress resubmission, offer to resume it
    if (resubmitInProgress && hasValidDraft) {
      document.getElementById("surveyContainer").innerHTML = `
        <div style="max-width:600px;margin:4rem auto;padding:2rem;text-align:center;
                    background:#f0f7ff;border:2px solid var(--blue-light);border-radius:8px;">
          <h2 style="color:var(--blue-dark)">You have an in-progress response</h2>
          <p style="margin-top:1rem;color:#444">
            You started submitting a new response but didn't finish.<br>
            Your draft is saved — would you like to continue?
          </p>
          <div style="margin-top:1.5rem;display:flex;gap:0.75rem;justify-content:center;">
            <button id="continueResubmitBtn" style="background:var(--blue);color:white;
                    border:none;padding:0.6rem 2rem;border-radius:6px;font-size:11pt;
                    cursor:pointer;font-weight:bold;">
              Continue my response
            </button>
            <button id="startOverResubmitBtn" style="background:white;color:var(--blue);
                    border:2px solid var(--blue);padding:0.6rem 2rem;border-radius:6px;font-size:11pt;
                    cursor:pointer;font-weight:bold;">
              Start over
            </button>
          </div>
        </div>`;
      document.getElementById("skipBtn").style.display = "none";
      document.getElementById("versionFooter").style.display = "none";

      document.getElementById("continueResubmitBtn").addEventListener("click", () => {
        allowResubmit = true;
        document.getElementById("surveyContainer").innerHTML = "";
        document.getElementById("skipBtn").style.display = "";
        document.getElementById("versionFooter").style.display = "";
        if (cachedSurveyJson) {
          initSurvey(cachedSurveyJson, true);
        } else {
          fetch("survey.json")
            .then(r => r.json())
            .then(json => { cachedSurveyJson = json; return initSurvey(json, true); });
        }
      });

      document.getElementById("startOverResubmitBtn").addEventListener("click", () => {
        localStorage.removeItem(DRAFT_KEY);
        localStorage.removeItem(RESUBMIT_KEY);
        startFreshResubmit();
      });
      return;
    }

    // Normal "already submitted" notice
    document.getElementById("surveyContainer").innerHTML = `
      <div style="max-width:600px;margin:4rem auto;padding:2rem;text-align:center;
                  background:#f0faf0;border:2px solid #a5d6a7;border-radius:8px;">
        <h2 style="color:#2e7d32">You've already submitted this survey</h2>
        <p style="margin-top:1rem;color:#444">
          Thank you! Your response has been recorded.<br>
          If your answers have changed or you'd like to submit again, click below.
        </p>
        <button id="resubmitBtn" style="margin-top:1.5rem;background:var(--blue);color:white;
                border:none;padding:0.6rem 2rem;border-radius:6px;font-size:11pt;
                cursor:pointer;font-weight:bold;">
          Submit again
        </button>
      </div>`;
    document.getElementById("skipBtn").style.display = "none";
    document.getElementById("versionFooter").style.display = "none";
    document.getElementById("resubmitBtn").addEventListener("click", startFreshResubmit);
  }

  function startFreshResubmit() {
    allowResubmit = true;
    localStorage.setItem(RESUBMIT_KEY, "1");
    document.getElementById("surveyContainer").innerHTML = "";
    document.getElementById("skipBtn").style.display = "";
    document.getElementById("versionFooter").style.display = "";
    // Clear old draft so we start fresh (but keep session_id for linking)
    localStorage.removeItem(DRAFT_KEY);
    // Use cached survey JSON if available, otherwise fetch
    if (cachedSurveyJson) {
      initSurvey(cachedSurveyJson);
    } else {
      fetch("survey.json")
        .then(r => r.json())
        .then(json => { cachedSurveyJson = json; return initSurvey(json); })
        .catch(err => {
          document.getElementById("surveyContainer").innerHTML =
            `<p style="color:red;padding:1rem">Failed to load survey: ${err.message}</p>`;
        });
    }
  }

  if (alreadySubmitted) {
    showAlreadySubmittedNotice();
  }

  // Track survey start time for completion_seconds
  const surveyStartTime = Date.now();
  let surveyVersion = null;

  // ── Version footer ───────────────────────────────────────────
  fetch("version.json")
    .then(r => r.json())
    .then(v => {
      surveyVersion = v.sha;
      const ver    = v.version || "?";
      const date   = new Date(v.date).toLocaleString("en-US", {
        timeZone: "America/Denver",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
      });
      document.getElementById("versionFooter").textContent =
        `Survey version ${ver} — built on ${date} MT`;
    })
    .catch(() => {
      document.getElementById("versionFooter").textContent =
        "Survey version ? — dev build";
    });

  // ── Load survey ─────────────────────────────────────────────
  let cachedSurveyJson = null;
  // Always fetch survey.json so it's cached for instant re-submit
  fetch("survey.json")
    .then(r => r.json())
    .then(json => {
      cachedSurveyJson = json;
      if (!alreadySubmitted) return initSurvey(json);
    })
    .catch(err => {
      if (!alreadySubmitted) {
        document.getElementById("surveyContainer").innerHTML =
          `<p style="color:red;padding:1rem">Failed to load survey: ${err.message}</p>`;
      }
    });

  function initSurvey(surveyJson, skipDraftPrompt) {
    const survey = new Survey.Model(surveyJson);
    // Allow HTML in question descriptions (used for embedded images like the babka cartoon)
    survey.onTextMarkdown.add((sender, options) => { options.html = options.text; });
    const intro = document.getElementById("surveyIntro");
    intro.textContent = surveyJson.description || "";

    // Section names for nav pills (one per page)
    const sectionLabels = (surveyJson.pages || []).map((p, i) => {
      // Derive short label from page title
      const title = p.navigationTitle || p.title || `Section ${i + 1}`;
      return title.replace(/^Section \d+:\s*/i, "").replace("Final Comments", "Final");
    });

    // ── Build section nav ──────────────────────────────────────
    const nav = document.getElementById("sectionPills");
    const sectionSelect = document.getElementById("sectionSelect");
    // Clear any existing pills/options (from a prior initSurvey call)
    nav.innerHTML = "";
    sectionSelect.innerHTML = "";
    const pills = sectionLabels.map((label, i) => {
      const pill = document.createElement("button");
      pill.className = "nav-pill";
      pill.textContent = `${i + 1}. ${label}`;
      pill.setAttribute("aria-label", `Go to ${label}`);
      pill.addEventListener("click", () => {
        survey.currentPageNo = i;
      });
      nav.appendChild(pill);

      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = `Section ${i + 1} of ${sectionLabels.length} — ${label}`;
      sectionSelect.appendChild(option);
      return pill;
    });
    sectionSelect.addEventListener("change", () => {
      survey.currentPageNo = Number(sectionSelect.value);
    });

    const completedPages = new Set();
    const draftNotice = document.getElementById("draftNotice");
    const draftMessage = document.getElementById("draftMessage");
    const draftStatus = document.getElementById("draftStatus");
    const surveyContainer = document.getElementById("surveyContainer");
    const actionBar = document.getElementById("actionBar");
    let draftTimer;

    // Session ID — needed for drafts and submit
    let sessionId = localStorage.getItem("ts_survey_session");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem("ts_survey_session", sessionId);
    }

    let savedDraft = null;
    try {
      savedDraft = JSON.parse(localStorage.getItem(DRAFT_KEY));
      if (!savedDraft?.savedAt || Date.now() - savedDraft.savedAt > DRAFT_TTL_MS) {
        localStorage.removeItem(DRAFT_KEY);
        savedDraft = null;
      }
    } catch {
      localStorage.removeItem(DRAFT_KEY);
    }
    let draftReady = !savedDraft;

    // When resuming a resubmission, load the draft directly without prompting
    if (skipDraftPrompt && savedDraft) {
      draftReady = true;
      survey.data = savedDraft.data || {};
      if (savedDraft.pageNo != null) survey.currentPageNo = savedDraft.pageNo;
    } else if (!savedDraft) {
      // No draft — but restore the last-visited page so refresh doesn't jump to page 1
      const savedPage = parseInt(localStorage.getItem(PAGE_KEY), 10);
      const maxPage = (surveyJson.pages || []).length - 1;
      if (!isNaN(savedPage) && savedPage > 0 && savedPage <= maxPage) {
        survey.currentPageNo = savedPage;
      }
    }

    // Check for server-side draft via ?draft=XXXX URL param (cross-device resume)
    const urlDraftId = new URLSearchParams(location.search).get("draft");
    let serverDraft = null;
    if (urlDraftId) {
      // Fetch async; will show prompt if found
      fetch(`${SUBMIT_URL.replace("/submit", "/draft")}?id=${urlDraftId}`)
        .then(r => r.json())
        .then(result => {
          if (result.success && result.data) {
            serverDraft = { data: result.data, pageNo: result.page_no || 0, draftId: urlDraftId };
            if (sessionId) localStorage.setItem("ts_survey_session", result.session_id || sessionId);
            // Show resume prompt
            draftMessage.textContent = `A saved draft was found from ${new Date(result.expires_at).toLocaleDateString()}. Would you like to resume?`;
            setDraftPromptVisible(true);
          }
        })
        .catch(() => {});
    }

    function setDraftPromptVisible(visible) {
      draftNotice.hidden = !visible;
      surveyContainer.hidden = visible;
      actionBar.hidden = visible;
    }

    function saveDraft() {
      if (!draftReady) return;
      clearTimeout(draftTimer);
      if (Object.keys(survey.data).length === 0) {
        localStorage.removeItem(DRAFT_KEY);
        draftStatus.hidden = true;
        return;
      }
      draftStatus.hidden = false;
      draftStatus.textContent = "Saving draft…";
      draftTimer = setTimeout(() => {
        const data = survey.data;
        const pageNo = survey.currentPageNo;
        const savedAt = Date.now();
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ data, pageNo, savedAt }));
        draftStatus.textContent = `Saved on this device at ${new Date(savedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
        // Also save to server for cross-device resume
        saveDraftToServer(data, pageNo);
      }, 500);
    }

    let serverDraftId = null;
    let serverDraftTimer = null;
    function saveDraftToServer(data, pageNo) {
      clearTimeout(serverDraftTimer);
      serverDraftTimer = setTimeout(async () => {
        try {
          const res = await fetch(SUBMIT_URL.replace("/submit", "/draft"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              _session:  sessionId,
              _page_no:  pageNo,
              data:      data,
            }),
          });
          const result = await res.json();
          if (result.success && result.draft_id) {
            serverDraftId = result.draft_id;
            const resumeUrl = `${location.origin}${location.pathname}?draft=${result.draft_id}`;
            draftStatus.innerHTML = `Saved at ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · <a href="${resumeUrl}" style="color:var(--blue);">Resume link</a>`;
          }
        } catch (e) {
          // Server save is best-effort; localStorage draft still works
        }
      }, 2000);
    }

    document.getElementById("resumeDraftBtn").addEventListener("click", () => {
      draftReady = true;
      const draft = serverDraft || savedDraft;
      survey.data = draft.data || {};
      survey.currentPageNo = Math.min(draft.pageNo || 0, lastPage);
      setDraftPromptVisible(false);
      updateNav(survey.currentPageNo);
      updateSkip(survey.currentPageNo);
      draftStatus.hidden = false;
      draftStatus.textContent = "Saved draft resumed";
    });

    document.getElementById("startOverBtn").addEventListener("click", () => {
      localStorage.removeItem(DRAFT_KEY);
      localStorage.removeItem(PAGE_KEY);
      savedDraft = null;
      serverDraft = null;
      draftReady = true;
      setDraftPromptVisible(false);
      updateNav(0);
      updateSkip(0);
      draftStatus.hidden = true;
    });

    function updateNav(pageNo) {
      sectionSelect.value = String(pageNo);
      const total = pills.length;
      const pct = Math.round(((pageNo + 1) / total) * 100);
      document.getElementById("progressLabel").textContent = `Section ${pageNo + 1} of ${total}`;
      document.getElementById("progressFill").style.width = `${pct}%`;
      document.getElementById("progressPct").textContent = `${pct}%`;
      pills.forEach((pill, i) => {
        pill.classList.remove("active", "done");
        if (i === pageNo) {
          pill.classList.add("active");
        } else if (completedPages.has(i)) {
          pill.classList.add("done");
        }
      });
    }

    // ── Skip button ────────────────────────────────────────────
    const skipBtn  = document.getElementById("skipBtn");
    const lastPage = (surveyJson.pages || []).length - 1;

    function updateSkip(pageNo) {
      intro.hidden = pageNo !== 0;
      if (pageNo >= lastPage) {
        skipBtn.classList.add("hidden");
      } else {
        skipBtn.classList.remove("hidden");
      }
    }

    skipBtn.addEventListener("click", () => survey.nextPage());

    // ── Page change ────────────────────────────────────────────
    survey.onCurrentPageChanged.add((_, opts) => {
      const prev = opts.oldCurrentPage ? survey.pages.indexOf(opts.oldCurrentPage) : -1;
      if (prev >= 0) completedPages.add(prev);
      const cur = survey.currentPageNo;
      updateNav(cur);
      updateSkip(cur);
      saveDraft();
      localStorage.setItem(PAGE_KEY, String(cur));
      window.scrollTo({ top: 0, behavior: "smooth" });
      setTimeout(wrapMatrixTables, 50);
    });

    survey.onAfterRenderQuestion.add(() => setTimeout(wrapMatrixTables, 30));
    survey.onValueChanged.add(saveDraft);

    // ── Custom question numbering (letter suffixes for conditional questions) ──
    // Conditional follow-ups get "3a", "11a", "41a" instead of causing renumbering
    const SUB_QUESTIONS = {
      'q4_ada_limits':         'q3_ada',
      'q13_children_activities': 'q12_children',
      'q_contact_request':     'q_contact_phone',
    };

    function computeQuestionNumbers() {
      const numbers = {};
      let n = 0;
      const subLetter = {};
      survey.pages.forEach(page => {
        page.questions.forEach(q => {
          if (!q.isVisible) return;
          const parent = SUB_QUESTIONS[q.name];
          if (parent) {
            subLetter[parent] = (subLetter[parent] || 0) + 1;
            numbers[q.name] = numbers[parent] + String.fromCharCode(97 + subLetter[parent] - 1);
          } else {
            n++;
            numbers[q.name] = String(n);
          }
        });
      });
      return numbers;
    }

    function updateQuestionNumbers() {
      const numbers = computeQuestionNumbers();
      Object.entries(numbers).forEach(([name, num]) => {
        const titleEl = document.querySelector(`[data-name="${name}"] .sd-question__title`);
        if (!titleEl) return;
        const existing = titleEl.querySelector('.custom-q-num');
        if (existing) existing.remove();
        const span = document.createElement('span');
        span.className = 'custom-q-num';
        span.textContent = num + '.';
        titleEl.insertBefore(span, titleEl.firstChild);
      });
    }
    survey.onAfterRenderQuestion.add(updateQuestionNumbers);
    survey.onValueChanged.add(updateQuestionNumbers);

    // ── Live selection counter for maxSelectedChoices questions ──
    function updateSelectionCounters() {
      const page = survey.currentPage;
      if (!page) return;
      page.questions.forEach(q => {
        if (!q.maxSelectedChoices) return;
        const val = q.value;
        const count = Array.isArray(val) ? val.length : (val ? 1 : 0);
        const max = q.maxSelectedChoices;
        const el = document.querySelector(`[data-name="${q.name}"] .sd-question__description`);
        if (el) {
          el.textContent = `Selected: ${count} of ${max}${count >= max ? " — limit reached" : ""}`;
          el.style.color = count >= max ? "#b00020" : "var(--text-muted)";
          el.style.fontWeight = count >= max ? "600" : "400";
        }
      });
    }
    survey.onValueChanged.add(updateSelectionCounters);
    survey.onAfterRenderQuestion.add(updateSelectionCounters);

    // Make progress bar buttons navigable by click
    function bindProgressNav() {
      document.querySelectorAll(".sd-progress-buttons__list-element").forEach((el, i) => {
        if (el.dataset.navBound) return;
        el.dataset.navBound = "1";
        el.style.cursor = "pointer";
        el.addEventListener("click", () => { survey.currentPageNo = i; });
      });
    }
    survey.onAfterRenderPage.add(() => setTimeout(bindProgressNav, 80));

    // Make every matrix scrollable on desktop; on mobile, inject column labels
    // for the stacked card layout (header is hidden via CSS on narrow screens)
    function wrapMatrixTables() {
      const isMobile = window.matchMedia("(max-width: 600px)").matches;

      document.querySelectorAll(".sd-matrix").forEach(el => {
        if (!isMobile) {
          el.style.overflowX = "";
          el.style.display   = "";
          el.style.maxWidth  = "";
          el.style.webkitOverflowScrolling = "";
        }
      });

      // Mobile: inject column label text next to each radio so users know
      // what each option means (since the <thead> is hidden on mobile)
      if (isMobile) {
        document.querySelectorAll(".sd-matrix").forEach(table => {
          const headerCells = table.querySelectorAll("thead th");
          if (headerCells.length === 0) return;
          const colLabels = [...headerCells].map(th => th.textContent.trim());

          table.querySelectorAll("tr").forEach(tr => {
            const cells = tr.querySelectorAll("td");
            cells.forEach((cell, i) => {
              if (i === 0) return; // skip row label
              if (!colLabels[i]) return;
              // Remove stale label if re-rendered
              const existing = cell.querySelector(".mobile-col-label");
              if (existing) existing.remove();
              const radio = cell.querySelector(".sd-radio");
              if (radio) {
                const label = document.createElement("span");
                label.className = "mobile-col-label";
                label.textContent = colLabels[i];
                radio.appendChild(label);
              }
            });
          });
        });
      }
    }

    // Initialise
    const initPage = survey.currentPageNo;
    updateNav(initPage);
    updateSkip(initPage);
    setTimeout(wrapMatrixTables, 200);

    // Re-run on orientation change / resize so mobile↔desktop layout adapts
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(wrapMatrixTables, 150);
    });

    // ── Submit ─────────────────────────────────────────────────
    const statusEl = document.getElementById("submitStatus");

    survey.onComplete.add((sender) => {
      statusEl.className = "sending";
      statusEl.textContent = "Sending your response…";

    // Which sections had any answers?
    const sectionsAnswered = (surveyJson.pages || [])
      .map(p => p.title)
      .filter((_, i) => {
        const page = survey.pages[i];
        return page?.questions?.some(q => sender.data[q.name] !== undefined);
      });

    const payload = {
      timestamp:            new Date().toISOString(),
      _session:             sessionId,
      _survey_version:      surveyVersion,
      _userAgent:           navigator.userAgent,
      _completion_seconds:  Math.round((Date.now() - surveyStartTime) / 1000),
      _sections_answered:   sectionsAnswered,
      _referrer:            document.referrer || null,
      ...sender.data
    };

      fetch(SUBMIT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(result => {
        if (result.success || result.error === "duplicate") {
          clearTimeout(draftTimer);
          localStorage.removeItem(DRAFT_KEY);
          localStorage.removeItem(PAGE_KEY);
          localStorage.removeItem(RESUBMIT_KEY);
          draftStatus.hidden = true;
          localStorage.setItem(SUBMITTED_KEY, "1");
          statusEl.className = "success";
          statusEl.textContent = result.error === "duplicate"
            ? "It looks like we already received your response — thank you!"
            : alreadySubmitted
              ? "Your updated response has been saved. Thank you for completing the survey again!"
              : "Your response has been saved. Thank you for completing the survey!";
          completedPages.add(lastPage);
          updateNav(lastPage);
        } else {
          throw new Error(result.error || "unknown");
        }
      })
      .catch(err => {
        statusEl.className = "error";
        statusEl.textContent =
          "There was a problem saving your response. Please contact the temple office or try again.";
        console.error("Submit error:", err);
      });
    });

    // ── Render ─────────────────────────────────────────────────
    survey.render(surveyContainer);
    if (savedDraft) {
      const savedDate = new Date(savedDraft.savedAt).toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
      draftMessage.textContent = `A draft saved on this device on ${savedDate} contains unfinished responses.`;
      setDraftPromptVisible(true);
    }
  }
</script>
