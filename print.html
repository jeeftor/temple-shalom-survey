<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Temple Shalom Member Survey 2026 — Print Version</title>
  <style>
    /* ── Screen styles ── */
    @page {
      size: letter landscape;
      margin: 0.4in 0.4in 0.6in 0.4in;
      @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-size: 9pt;
        color: #888;
      }
    }
    body {
      font-family: 'Georgia', serif;
      max-width: 850px;
      margin: 1rem auto;
      padding: 0 1rem;
      color: #111;
      font-size: 12pt;
      line-height: 1.4;
    }
    header {
      border-bottom: 3px solid #0038b8;
      padding-bottom: 0.6rem;
      margin-bottom: 0.8rem;
    }
    header h1 { font-size: 18pt; margin: 0; color: #00277d; }
    header p  { font-size: 9pt; color: #555; margin: 0.3rem 0 0; }

    .section {
      margin: 0.8rem 0;
    }
    .section-header {
      background: #0038b8;
      color: white;
      padding: 0.35rem 0.8rem;
      font-size: 11pt;
      font-weight: bold;
      border-radius: 4px;
    }
    .section-optional {
      font-size: 9pt;
      font-weight: normal;
      opacity: 0.85;
      margin-left: 0.5rem;
    }
    .section-skip {
      background: #dce8ff;
      padding: 0.2rem 0.8rem;
      font-size: 9pt;
      color: #00277d;
      font-style: italic;
      border-radius: 0 0 4px 4px;
    }
    .section-body { padding: 0.5rem 0.8rem; }

    .question { margin: 0.6rem 0; }
    .question-text {
      font-weight: bold;
      font-size: 10.5pt;
      margin-bottom: 0.3rem;
    }
    .question-num {
      color: #0038b8;
      margin-right: 0.4rem;
    }
    .question-desc {
      font-size: 9pt;
      color: #333;
      margin-bottom: 0.4rem;
      font-style: italic;
    }
    .branch-note {
      font-size: 9pt;
      color: #333;
      background: #fffbe6;
      border-left: 3px solid #f0a500;
      padding: 0.2rem 0.5rem;
      margin-bottom: 0.5rem;
    }

    /* Choice lists */
    .choices { list-style: none; padding: 0; margin: 0; }
    .choices li {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin: 0.15rem 0;
      font-size: 10.5pt;
    }
    .box {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 1.5px solid #333;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .box.square { border-radius: 2px; }

    /* Matrix tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9.5pt;
      margin: 0.3rem 0;
    }
    th {
      background: #0038b8;
      color: white;
      padding: 0.3rem 0.4rem;
      text-align: center;
      font-weight: 600;
    }
    td {
      border: 1px solid #ccc;
      padding: 0.25rem 0.4rem;
      vertical-align: middle;
    }
    tr:nth-child(even) td { background: #f0f5ff; }
    td.row-label { font-weight: 500; text-align: left; }
    td.radio-cell { text-align: center; }

    /* Text boxes */
    .text-box {
      border: 1px solid #aaa;
      border-radius: 4px;
      min-height: 80px;
      width: 100%;
      margin-top: 0.2rem;
    }
    .text-line {
      border: none;
      border-bottom: 1px solid #aaa;
      width: 100%;
      display: block;
      margin: 0.3rem 0;
    }

    /* Print button */
    #printBtn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: #0038b8;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11pt;
      font-weight: bold;
    }
    #printBtn:hover { background: #00277d; }

    /* ── Print styles ── */
    @media print {
      body {
        margin: 0;
        max-width: 100%;
        font-size: 11pt;
        padding: 0;
      }
      #printBtn { display: none; }
      /* Sections can break freely */
      .section { page-break-inside: auto; }
      /* Non-matrix questions stay together (avoid orphaned question text) */
      .question { page-break-inside: avoid; }
      /* Matrix questions CAN split — the question text stays on one page
         but the table rows can flow to the next page with header repeat */
      .question.has-matrix { page-break-inside: auto; }
      .question.has-matrix > .question-text { page-break-after: avoid; }
      .question.has-matrix > .question-desc { page-break-after: avoid; }
      /* Matrix tables split across pages; <thead> repeats automatically */
      table { page-break-inside: auto; }
      thead { display: table-header-group; }
      tr { page-break-inside: avoid; }
      /* Section headers stay with following content (no orphaned headers) */
      .section-header { page-break-after: avoid; }
      .section-skip { page-break-after: avoid; }
      /* Section body stays with its header */
      .section-body { page-break-before: avoid; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>

<button id="printBtn" onclick="window.print()" disabled style="opacity:0.5">Loading…</button>

<header>
  <h1>Temple Shalom Member Survey 2026</h1>
  <p>
    Colorado Springs, Colorado &nbsp;·&nbsp;
    Confidential<br>
    Each adult member of the household should complete a separate survey.
    All sections marked OPTIONAL may be skipped.
  </p>
</header>

<div id="surveyPrint">Loading survey…</div>

<script>
// Fetch survey.json and render synchronously into a single HTML string,
// then replace the container in one shot. Safari's PDF engine doesn't
// always capture DOM built incrementally via appendChild.
let surveyData = null;
fetch("survey.json")
  .then(r => r.json())
  .then(survey => {
    surveyData = survey;
    const html = buildPrintHTML(survey);
    document.getElementById("surveyPrint").innerHTML = html;
    const btn = document.getElementById("printBtn");
    btn.disabled = false;
    btn.style.opacity = "1";
    btn.textContent = "Print / Save PDF";
  })
  .catch(err => {
    document.getElementById("surveyPrint").textContent = "Error loading survey: " + err.message;
  });

// Conditional questions that get letter suffixes instead of their own number
const SUB_QUESTIONS = {
  'q4_ada_limits':           'q3_ada',
  'q13_children_activities': 'q12_children',
};

// Pre-compute question numbers (letter suffixes for conditional follow-ups)
let qNumberMap = {};
function buildQNumberMap(survey) {
  qNumberMap = {};
  let n = 0;
  const subLetter = {};
  survey.pages.forEach(page => {
    (page.elements || []).forEach(el => {
      const parent = SUB_QUESTIONS[el.name];
      if (parent) {
        subLetter[parent] = (subLetter[parent] || 0) + 1;
        const letter = String.fromCharCode(97 + subLetter[parent] - 1);
        qNumberMap[el.name] = qNumberMap[parent] + letter;
      } else {
        n++;
        qNumberMap[el.name] = String(n);
      }
    });
  });
}

function buildPrintHTML(survey) {
  buildQNumberMap(survey);

  let html = "";
  survey.pages.forEach((page) => {
    html += '<div class="section">';
    html += '<div class="section-body">';
    (page.elements || []).forEach(el => {
      html += renderQuestionHTML(el);
    });
    html += '</div></div>';
  });
  return html;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderQuestionHTML(el) {
  const num = qNumberMap[el.name] || "?";
  const cls = el.type === "matrix" ? "question has-matrix" : "question";
  let html = `<div class="${cls}">`;
  html += `<div class="question-text"><span class="question-num">${num}.</span> ${esc(el.title || el.name)}</div>`;
  if (el.description) {
    html += `<div class="question-desc">${esc(el.description)}</div>`;
  }
  switch (el.type) {
    case "matrix":    html += renderMatrixHTML(el); break;
    case "checkbox":  html += renderChoicesHTML(el, "square"); break;
    case "radiogroup":html += renderChoicesHTML(el, "circle"); break;
    case "comment":   html += renderTextAreaHTML(el); break;
    case "text":      html += renderTextLineHTML(); break;
    case "rating":    html += renderRatingHTML(el); break;
    default:          html += renderTextLineHTML();
  }
  html += '</div>';
  return html;
}

function renderMatrixHTML(el) {
  let html = '<table><thead><tr><th style="width:35%"></th>';
  (el.columns || []).forEach(col => {
    html += `<th>${esc(col.text || col.value)}</th>`;
  });
  html += '</tr></thead><tbody>';
  (el.rows || []).forEach(row => {
    html += `<tr><td class="row-label">${esc(row.text || row.value)}</td>`;
    (el.columns || []).forEach(() => {
      html += '<td class="radio-cell"><span class="box"></span></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function renderChoicesHTML(el, shape) {
  const choices = [...(el.choices || [])];
  if (el.hasOther) choices.push({ value: "other", text: "Other: ___________________" });
  let html = '<ul class="choices">';
  choices.forEach(c => {
    html += `<li><span class="box ${shape === 'square' ? 'square' : ''}"></span> ${esc(c.text || c.value)}</li>`;
  });
  html += '</ul>';
  return html;
}

function renderTextAreaHTML(el) {
  const lines = el.rows || 6;
  return `<div class="text-box" style="min-height:${lines * 1.6}rem"></div>`;
}

function renderTextLineHTML() {
  return '<span class="text-line">&nbsp;</span>';
}

function renderRatingHTML(el) {
  const min = el.rateMin ?? 0;
  const max = el.rateMax ?? 10;
  let html = '<ul class="choices" style="flex-direction:row;display:flex;flex-wrap:wrap;gap:0.5rem">';
  for (let i = min; i <= max; i++) {
    html += `<li><span class="box"></span> ${i}</li>`;
  }
  html += `</ul><div style="font-size:9pt;color:#555">${min} = ${esc(el.minRateDescription || "Low")}  ·  ${max} = ${esc(el.maxRateDescription || "High")}</div>`;
  return html;
}

</script>
</body>
</html>
